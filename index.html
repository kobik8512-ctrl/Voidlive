<style>
:root{--bg:#0a0a0c;--panel:#14141a;--line:#2a2a35;--ink:#f2f2f5;--muted:#8b8b9a;--red:#ff3b4a;--pink:#ff2d55;--green:#3dff9a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
#app{height:100%;width:100%;position:relative}
.home{height:100%;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.logo{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.home-title{font-size:28px;font-weight:800;margin-top:4px}.home-title span{color:var(--red)}
.user-row{font-size:13px;color:var(--muted);margin-top:6px}.user-row strong{color:var(--green)}
.debug-box{background:#1a1a08;border:1px solid #5a5a20;border-radius:10px;padding:8px 10px;font-size:11px;color:#c8c870;margin:8px 0;line-height:1.45;word-break:break-word;max-height:130px;overflow-y:auto}
.debug-box.bad{border-color:#5a2020;background:#1a0808;color:#ff8a8a}
.debug-box.ok{border-color:#205a30;background:#081a0c;color:#8aff9a}
.lives-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px 0}
.lives-list{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.live-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.live-card-info{flex:1;min-width:0}
.live-card-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-card-meta{font-size:12px;color:var(--muted);margin-top:3px}
.live-dot-sm{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-right:5px;animation:pulse 1.4s infinite}

.join-btn{flex:none;border:none;border-radius:999px;padding:8px 14px;background:var(--pink);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 16px;line-height:1.5}
.bottom-bar{padding-top:8px;display:flex;flex-direction:column;gap:8px}
.go-live{width:100%;padding:16px;border:none;border-radius:999px;background:linear-gradient(135deg,#ff2d55,#ff5c8a);color:#fff;font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 32px rgba(255,45,85,.3)}
.ghost-btn{width:100%;padding:12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.err{color:var(--red);font-size:13px;text-align:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.modal-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:env(safe-area-inset-bottom)}
.modal-card h2{font-size:18px;margin-bottom:6px}.modal-card p{font-size:13px;color:var(--muted);margin-bottom:12px}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0c0c10;color:#fff;font-size:15px;outline:none;margin-bottom:12px}
.stage{height:100%;display:flex;flex-direction:column;background:#000}
.video-wrap{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111}
.cam-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:14px;padding:24px;line-height:1.5}
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 12px 12px;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent)}
.live-pill{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px 6px 8px;backdrop-filter:blur(8px);max-width:75%}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite;flex:none}
.live-label{font-size:11px;font-weight:800;letter-spacing:.12em;flex:none}
.stream-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.viewers{font-size:13px;font-weight:700;flex:none}
.top-actions{display:flex;gap:8px;flex:none}
.end-btn,.flip-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.55);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.b-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,45,85,.85);color:#fff;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.floats{position:absolute;right:10px;bottom:38%;width:60px;height:40%;pointer-events:none;z-index:15;overflow:hidden}
.float-emoji{position:absolute;bottom:0;left:50%;font-size:22px;animation:floatUp 2.2s ease-out forwards;opacity:0}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-180px) scale(1.15);opacity:0}}
.chat-wrap{position:relative;height:min(38vh,320px);background:linear-gradient(to top,rgba(0,0,0,.92) 70%,rgba(0,0,0,.55));display:flex;flex-direction:column;z-index:10}
.chat-list{flex:1;overflow:hidden;padding:10px 12px 6px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;mask-image:linear-gradient(to bottom,transparent,#000 18%)}
.chat-line{font-size:13px;line-height:1.3;word-break:break-word}
.chat-line.new{animation:chatIn .15s ease-out}
@keyframes chatIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.chat-user{font-weight:700;margin-right:6px}
.chat-input-row{display:flex;gap:8px;padding:8px 12px max(10px,env(safe-area-inset-bottom))}
.chat-input{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:10px 14px;font-size:14px;outline:none}
.chat-send{border:none;border-radius:999px;padding:0 16px;background:var(--pink);color:#fff;font-weight:700;cursor:pointer}
.mic-status{position:absolute;top:-28px;left:12px;font-size:11px;color:var(--muted);background:rgba(0,0,0,.5);padding:3px 8px;border-radius:6px;cursor:pointer}
.mic-status.on{color:var(--green)}
.gift-btn{border:none;border-radius:999px;padding:0 14px;background:linear-gradient(135deg,#ffc14a,#ff7a18);color:#111;font-weight:800;font-size:16px;cursor:pointer}
.coins-pill{font-size:12px;font-weight:700;color:#ffc14a;background:rgba(0,0,0,.45);border-radius:999px;padding:4px 10px;border:1px solid rgba(255,193,74,.35)}
.gift-panel{position:absolute;left:0;right:0;bottom:0;z-index:40;max-height:55vh;background:#121218;border-radius:16px 16px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.gift-panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.gift-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;overflow-y:auto;flex:1}
.gift-item{background:#1a1a22;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer}
.gift-emoji{font-size:26px}.gift-name{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gift-cost{font-size:11px;color:#ffc14a;font-weight:700;margin-top:2px}
.gift-float{position:absolute;left:50%;bottom:42%;z-index:30;pointer-events:none;font-size:42px;animation:giftPop 2.4s ease-out forwards;text-align:center;transform:translateX(-50%)}
.gift-float small{display:block;font-size:12px;color:#fff;margin-top:4px;text-shadow:0 2px 8px #000}
@keyframes giftPop{0%{transform:translateX(-50%) translateY(40px) scale(.4);opacity:0}15%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.15)}100%{transform:translateX(-50%) translateY(-120px) scale(1);opacity:0}}
.retry-cam{margin-top:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
</style>

    {id:'teddy',n:'Teddy',e:'🧸',c:120},{id:'ring',n:'Ring',e:'💍',c:200},{id:'crown_s',n:'Crown',e:'👑',c:300},
    {id:'rocket',n:'Rocket',e:'🚀',c:500},{id:'trophy',n:'Trophy',e:'🏆',c:750},{id:'car',n:'Car',e:'🏎️',c:1200},
    {id:'yacht',n:'Yacht',e:'🛥️',c:2500},{id:'plane',n:'Jet',e:'✈️',c:5000},{id:'castle',n:'Castle',e:'🏰',c:8000},
    {id:'unicorn',n:'Unicorn',e:'🦄',c:10000},{id:'dragon',n:'Dragon',e:'🐉',c:15000},{id:'king',n:'King',e:'👑',c:50000},
    {id:'universe',n:'Universe',e:'🪐',c:100000},{id:'lol',n:'LOL',e:'😂',c:18},{id:'party',n:'Party',e:'🥳',c:28},
    {id:'pizza',n:'Pizza',e:'🍕',c:42},{id:'game',n:'Game',e:'🎮',c:140},{id:'money',n:'Money',e:'💰',c:1000},{id:'100',n:'100',e:'💯',c:100}
  ];

  let fbApp=null,fbAuth=null,fbDb=null,fbReady=false;
  const state={
    screen:'home',user:null,error:null,lives:[],showNameModal:false,streamTitle:'',
    liveId:null,isHost:false,isOwnerStream:false,hostName:'',title:'',
    viewers:0,realViewers:0,botViewers:0,stream:null,demo:false,chatBurstUntil:0,
    facingMode:'user',muted:false,injectedBots:[],coins:0,showGifts:false,hostUid:null,
    debug:'Booting…',debugOk:null,livesSnapCount:0
  };

  let livesUnsub=null,liveUnsub=null,chatUnsub=null,presenceUnsub=null;
  let chatTimer=null,viewerTimer=null,recognition=null,paintScheduled=false;
  let heartbeatTimer=null,injectedChatTimer=null,livesPollTimer=null;
  const chatLines=[];
  const STALE_MS=5*60*1000;
  const pcs={};
  let signalUnsub=null;
  const iceServers={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};

  function isOwnerEmail(email){return (email||'').toLowerCase()===OWNER_EMAIL;}
  function canAddBots(){if(!state.user)return false;if(state.user.isOwner)return true;if(HOST_CAN_ADD_BOTS&&state.isHost)return true;return false;}
  function useAutoBots(){if(AUTO_BOTS_FOR_ALL_HOSTS&&state.isHost)return true;return !!(state.isHost&&state.isOwnerStream);}
  function randName(){return Math.random()<0.55?NAMES[Math.floor(Math.random()*NAMES.length)]:'user'+Math.floor(100+Math.random()*8900);}
  function randColor(){return COLORS[Math.floor(Math.random()*COLORS.length)];}
  function randChat(){return CHAT_POOL[Math.floor(Math.random()*CHAT_POOL.length)];}
  function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function formatViewers(n){n=Math.max(0,Math.floor(n));if(n>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1000)return(n/1000).toFixed(1).replace(/\.0$/,'')+'K';return String(n);}
  function formatCoins(n){if(n===Infinity||n>1e15)return'∞';if(n>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(n>=1000)return(n/1000).toFixed(1).replace(/\.0$/,'')+'K';return String(Math.floor(n));}
  function setDebug(msg,ok){
    state.debug=msg;if(ok!==undefined)state.debugOk=ok;
    const el=document.getElementById('debugBox');
    if(el){el.textContent=msg;el.className='debug-box'+(state.debugOk===true?' ok':state.debugOk===false?' bad':'');}
  }

  async function loadCoins(){
    if(!state.user||!fbDb)return;
    if(state.user.isOwner){state.coins=Infinity;return;}
    try{
      const ref=fbDb.collection('userCoins').doc(state.user.uid);
      const doc=await ref.get();
      if(!doc.exists){await ref.set({coins:0,name:state.user.name,updatedAt:Date.now()});state.coins=0;}
      else state.coins=doc.data().coins||0;
    }catch(e){state.coins=0;}
  }

  function showGiftAnim(emoji,label){
    const wrap=document.querySelector('.video-wrap')||document.getElementById('app');
    if(!wrap)return;
    const el=document.createElement('div');
    el.className='gift-float';
    el.innerHTML=emoji+(label?'<small>'+escapeHtml(label)+'</small>':'');
    wrap.appendChild(el);
    setTimeout(()=>el.remove(),2500);
  }

  async function sendGift(gift){
    if(!state.user||!state.liveId||!gift)return;
    if(!state.hostUid&&state.isHost)state.hostUid=state.user.uid;
    if(!state.hostUid)return;
    const cost=gift.c||0;
    const isInf=state.user.isOwner;
    if(!isInf&&state.coins<cost){state.error='Not enough coins';setTimeout(()=>{state.error=null;},2000);render();return;}
    const credit=Math.floor(cost*0.7);
    try{
      if(!isInf){
        const ref=fbDb.collection('userCoins').doc(state.user.uid);
        await fbDb.runTransaction(async tx=>{
          const snap=await tx.get(ref);
          const cur=snap.exists?(snap.data().coins||0):0;
          if(cur<cost)throw new Error('Not enough coins');
          tx.set(ref,{coins:cur-cost,name:state.user.name,updatedAt:Date.now()},{merge:true});
        });
        state.coins=Math.max(0,state.coins-cost);
      }
      if(state.hostUid&&state.hostUid!==state.user.uid){
        const href=fbDb.collection('userCoins').doc(state.hostUid);
        await fbDb.runTransaction(async tx=>{
          const snap=await tx.get(href);
          const cur=snap.exists?(snap.data().coins||0):0;
          tx.set(href,{coins:cur+credit,updatedAt:Date.now()},{merge:true});
        }).catch(()=>{});
      }
      await fbDb.collection('lives').doc(state.liveId).collection('messages').add({
        uid:state.user.uid,name:state.user.name,
        text:'sent '+gift.e+' '+gift.n+(cost?' ('+formatCoins(cost)+'🪙)':''),
        color:'#ffc14a',bot:false,gift:true,giftEmoji:gift.e,giftName:gift.n,giftCost:cost,ts:Date.now()
      });
      showGiftAnim(gift.e,state.user.name+' → '+gift.n);
      state.showGifts=false;render();
      setTimeout(()=>showGiftAnim(gift.e,state.user.name+' sent '+gift.n),50);
    }catch(e){state.error=e.message||'Gift failed';render();}
  }

  try{
    fbApp=firebase.initializeApp(firebaseConfig);
    fbAuth=firebase.auth();
    fbDb=firebase.firestore();
    fbReady=true;
    fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    fbAuth.onAuthStateChanged(u=>{
      if(u){
        state.user={uid:u.uid,name:u.displayName||'Player',email:(u.email||'').toLowerCase(),photoURL:u.photoURL||'',isOwner:isOwnerEmail(u.email)};

        setDebug('Signed in: '+state.user.email+(state.user.isOwner?' (owner)':''),true);
      }else{
        state.user=null;state.coins=0;
        setDebug('Not signed in — sign in to go live',null);
      }
      if(state.screen==='home'){subscribeLives();render();}
    });
  }catch(e){
    state.error='Firebase init failed: '+(e.message||e);
    setDebug('Firebase init FAILED: '+(e.message||e),false);
  }

  function signIn(){
    if(!fbReady)return;
    const provider=new firebase.auth.GoogleAuthProvider();
    fbAuth.signInWithPopup(provider).catch(()=>{
      fbAuth.signInWithRedirect(provider).catch(e2=>{
        state.error=e2.message||'Sign in failed';
        setDebug('Sign-in failed: '+(e2.message||e2),false);
        render();
      });
    });
  }
  function signOut(){if(fbAuth)fbAuth.signOut();}

  function isLiveFresh(data){
    if(!data||data.status!=='live')return false;
    const now=Date.now();
    const hb=typeof data.hb==='number'?data.hb:0;
    const started=typeof data.startedAt==='number'?data.startedAt:0;
    let created=0;
    if(data.createdAt){
      if(typeof data.createdAt.toMillis==='function')created=data.createdAt.toMillis();
      else if(typeof data.createdAt==='number')created=data.createdAt;
    }
    if(hb&&(now-hb)<STALE_MS)return true;
    if(started&&(now-started)<STALE_MS)return true;
    if(created&&(now-created)<STALE_MS)return true;
    if(!hb&&!started&&!created)return true;
    return false;
  }

  function applyLivesFromSnap(snap){
    const list=[];
    snap.forEach(doc=>{
      const data=doc.data();
      if(!isLiveFresh(data))return;
      list.push({id:doc.id,...data});
    });
    list.sort((a,b)=>(b.hb||b.startedAt||0)-(a.hb||a.startedAt||0));
    state.lives=list;
    state.livesSnapCount=(state.livesSnapCount||0)+1;
    if(state.screen==='home'){
      setDebug('Lives OK · '+list.length+' live · updates:'+state.livesSnapCount+(state.user?' · '+state.user.email:''),true);
      render();
    }
  }

  function subscribeLives(){
    if(!fbReady||!fbDb)return;
    if(livesUnsub){try{livesUnsub();}catch(e){}livesUnsub=null;}
    if(livesPollTimer){clearInterval(livesPollTimer);livesPollTimer=null;}
    livesUnsub=fbDb.collection('lives').where('status','==','live').onSnapshot(
      snap=>applyLivesFromSnap(snap),
      err=>{
        console.warn('lives error',err);
        const msg=(err&&err.message)||String(err);
        setDebug('LIVES READ BLOCKED: '+msg+' → Fix Firebase Rules!',false);
        state.error='Cannot load lives (rules). Publish Rules below.';
        if(state.screen==='home')render();
        startLivesPoll();
      }
    );
    startLivesPoll();
  }

  function startLivesPoll(){
    if(livesPollTimer)return;
    const pull=async()=>{
      if(!fbDb||state.screen!=='home')return;
      try{
        const snap=await fbDb.collection('lives').where('status','==','live').get();
        applyLivesFromSnap(snap);
      }catch(err){
        const msg=(err&&err.message)||String(err);
        if(/permission|insufficient/i.test(msg))setDebug('LIVES READ BLOCKED by rules: '+msg,false);
      }
    };
    pull();
    livesPollTimer=setInterval(pull,8000);
  }

  function startHeartbeat(){
    stopHeartbeat();
    if(!state.isHost||!state.liveId||!fbDb)return;

      if(!state.isHost||!state.liveId)return;
      fbDb.collection('lives').doc(state.liveId).update({hb:Date.now(),status:'live'})
        .catch(err=>setDebug('Heartbeat failed: '+((err&&err.message)||err),false));

  async function forceEndLive(liveId){

  function openNameModal(){

    state.streamTitle=state.user.name+"'s Live";

  async function confirmGoLive(){
    if(!fbReady||!state.user)return;
    const title=(state.streamTitle||'').trim()||(state.user.name+"'s Live");
    state.showNameModal=false;
    state.error='Starting live…';
    setDebug('Creating live document…',null);
    render();
    try{
      try{
        const prev=await fbDb.collection('lives').where('hostUid','==',state.user.uid).where('status','==','live').get();
        const batch=fbDb.batch();
        prev.forEach(d=>batch.update(d.ref,{status:'ended',hb:0,endedAt:firebase.firestore.FieldValue.serverTimestamp()}));
        if(!prev.empty)await batch.commit();
      }catch(e){}

      const ref=fbDb.collection('lives').doc();
      const isOwnerStream=!!state.user.isOwner;
      const now=Date.now();
      await ref.set({
        hostUid:state.user.uid,hostName:state.user.name,hostEmail:state.user.email||'',
        title,status:'live',isOwnerStream,viewerCount:0,realViewerCount:0,
        hb:now,startedAt:now,createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      setDebug('Live created · id='+ref.id.slice(0,8)+'… · other phone needs Rules to see it',true);

      state.liveId=ref.id;state.isHost=true;state.isOwnerStream=isOwnerStream;
      state.hostName=state.user.name;state.hostUid=state.user.uid;state.title=title;
      state.viewers=0;state.realViewers=0;state.botViewers=0;state.injectedBots=[];
      state.screen='live';state.error=null;chatLines.length=0;

      let camOk=await startCamera();
      if(!camOk){await new Promise(r=>setTimeout(r,300));camOk=await startCamera();}
      state.demo=!camOk;render();attachCam();
      subscribeToLive(ref.id);subscribeChat(ref.id);
      await joinPresence(ref.id);startHeartbeat();
      if(useAutoBots()){startViewerGrowth();startBotChatEngine();burstGreetings();}
      setTimeout(()=>startListening(),500);
      window.addEventListener('pagehide',onPageHideEnd);
      window.addEventListener('beforeunload',onPageHideEnd);
    }catch(err){
      console.error(err);
      const msg=(err&&err.message)||String(err);
      if(/permission|insufficient/i.test(msg)){
        state.error='Firestore blocked write. Publish Rules!';
        setDebug('WRITE BLOCKED by rules: '+msg,false);
      }else{
        state.error='Could not start live: '+msg;
        setDebug('Go live error: '+msg,false);
      }
      state.showNameModal=false;state.screen='home';render();
    }
  }

  async function joinLive(liveId){
    if(!fbReady||!state.user){signIn();return;}
    if(state.liveId===liveId)return;
    await leaveCurrentLive(false);
    let doc;
    try{doc=await fbDb.collection('lives').doc(liveId).get();}
    catch(e){state.error='Cannot open live: '+(e.message||e);setDebug('Join failed: '+(e.message||e),false);render();return;}
    if(!doc.exists||doc.data().status!=='live'){state.error='That live ended.';render();return;}
    const data=doc.data();
    state.liveId=liveId;state.isHost=data.hostUid===state.user.uid;state.isOwnerStream=!!data.isOwnerStream;
    state.hostName=data.hostName||'Host';state.hostUid=data.hostUid||null;state.title=data.title||'Live';
    state.viewers=data.viewerCount||0;state.realViewers=data.realViewerCount||0;state.botViewers=0;
    state.injectedBots=[];state.screen=state.isHost?'live':'watch';state.demo=true;state.showGifts=false;chatLines.length=0;
    render();subscribeToLive(liveId);subscribeChat(liveId);await joinPresence(liveId);
    if(state.isHost){
      startHeartbeat();
      window.addEventListener('pagehide',onPageHideEnd);
      window.addEventListener('beforeunload',onPageHideEnd);
      const camOk=await startCamera();state.demo=!camOk;render();attachCam();
      if(useAutoBots()){startViewerGrowth();startBotChatEngine();setTimeout(()=>startListening(),500);}
    }else setTimeout(()=>startViewerWebRTC(liveId),400);
  }

  function onPageHideEnd(){
    if(state.isHost&&state.liveId&&fbDb){
      fbDb.collection('lives').doc(state.liveId).update({status:'ended',hb:0,endedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
    }
  }

  async function leaveCurrentLive(goHome){
    stopListening();stopBotChatEngine();stopInjectedBotEngine();stopViewerGrowth();stopHeartbeat();stopAllPeers();stopCamera();
    window.removeEventListener('pagehide',onPageHideEnd);
    window.removeEventListener('beforeunload',onPageHideEnd);
    if(liveUnsub){liveUnsub();liveUnsub=null;}
    if(chatUnsub){chatUnsub();chatUnsub=null;}
    if(presenceUnsub){presenceUnsub();presenceUnsub=null;}
    if(fbReady&&state.liveId&&state.user){
      try{await fbDb.collection('lives').doc(state.liveId).collection('viewers').doc(state.user.uid).delete();}catch(e){}
      if(state.isHost){
        try{await fbDb.collection('lives').doc(state.liveId).update({status:'ended',hb:0,endedAt:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){}
      }
    }
    state.liveId=null;state.isHost=false;state.isOwnerStream=false;
    state.viewers=0;state.botViewers=0;state.realViewers=0;state.injectedBots=[];chatLines.length=0;
    if(goHome!==false){state.screen='home';subscribeLives();render();}

  function subscribeToLive(liveId){
    if(liveUnsub)liveUnsub();
    liveUnsub=fbDb.collection('lives').doc(liveId).onSnapshot(doc=>{
      if(!doc.exists)return;
      const d=doc.data();
      if(d.status!=='live'&&!state.isHost){state.error='Live ended.';leaveCurrentLive(true);return;}
      state.title=d.title||state.title;state.hostName=d.hostName||state.hostName;state.isOwnerStream=!!d.isOwnerStream;
      if(!useAutoBots()||!state.isHost){state.viewers=d.viewerCount||0;state.realViewers=d.realViewerCount||0;updateViewerLabel();}
    });
  }

  async function joinPresence(liveId){
    if(!state.user)return;
    const vRef=fbDb.collection('lives').doc(liveId).collection('viewers').doc(state.user.uid);
    if(state.isHost){try{await vRef.delete();}catch(e){}}
    else{try{await vRef.set({name:state.user.name,joinedAt:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){setDebug('Presence write failed: '+(e.message||e),false);}}
    if(presenceUnsub)presenceUnsub();
    presenceUnsub=fbDb.collection('lives').doc(liveId).collection('viewers').onSnapshot(async snap=>{
      let real=0;
      if(state.isHost)snap.forEach(doc=>{if(doc.id!==state.user.uid)real++;});
      else real=snap.size;
      state.realViewers=real;
      state.viewers=(useAutoBots()&&state.isHost)?(real+state.botViewers):real;
      updateViewerLabel();
      if(state.isHost){
        try{await fbDb.collection('lives').doc(liveId).update({realViewerCount:real,viewerCount:useAutoBots()?(real+state.botViewers):real});}catch(e){}
        const active=new Set();
        snap.forEach(doc=>{
          if(doc.id!==state.user.uid){active.add(doc.id);if(!doc.data().isBot)ensureHostPeer(doc.id);}
        });
        Object.keys(pcs).forEach(uid=>{
          if(uid==='host')return;
          if(!active.has(uid)){
            try{if(pcs[uid]._unsub)pcs[uid]._unsub();if(pcs[uid]._iceUnsub)pcs[uid]._iceUnsub();pcs[uid].close();}catch(e){}
            delete pcs[uid];
            signalsRef(liveId,uid).delete().catch(()=>{});
          }
        });
      }
    },err=>setDebug('Viewers listen failed: '+(err.message||err),false));
  }

  function signalsRef(liveId,uid){return fbDb.collection('lives').doc(liveId).collection('signals').doc(uid);}
  function stopAllPeers(){
    Object.keys(pcs).forEach(uid=>{try{pcs[uid].close();}catch(e){}delete pcs[uid];});
    if(signalUnsub){signalUnsub();signalUnsub=null;}
  }
  function wireIce(pc,channelUid){
    pc.onicecandidate=ev=>{
      if(!ev.candidate||!state.liveId)return;
      fbDb.collection('lives').doc(state.liveId).collection('signals').doc(channelUid)
        .collection('ice').add({from:state.user.uid,candidate:ev.candidate.toJSON(),t:Date.now()}).catch(()=>{});
    };
  }

  async function ensureHostPeer(viewerUid){
    if(!state.isHost||!state.stream)return;
    if(pcs[viewerUid]){
      const st=pcs[viewerUid].connectionState;
      if(st==='connected'||st==='connecting'||st==='new')return;
      try{if(pcs[viewerUid]._unsub)pcs[viewerUid]._unsub();if(pcs[viewerUid]._iceUnsub)pcs[viewerUid]._iceUnsub();pcs[viewerUid].close();}catch(e){}
      delete pcs[viewerUid];
    }
    try{
      try{await signalsRef(state.liveId,viewerUid).delete();}catch(e){}
      const pc=new RTCPeerConnection(iceServers);
      pcs[viewerUid]=pc;
      state.stream.getTracks().forEach(track=>{try{pc.addTrack(track,state.stream);}catch(e){}});
      wireIce(pc,viewerUid);
      pc.onconnectionstatechange=()=>{
        if(pc.connectionState==='failed'||pc.connectionState==='closed'||pc.connectionState==='disconnected'){
          try{if(pc._unsub)pc._unsub();if(pc._iceUnsub)pc._iceUnsub();pc.close();}catch(e){}
          delete pcs[viewerUid];
        }
      };
      const offer=await pc.createOffer({offerToReceiveAudio:false,offerToReceiveVideo:false});
      await pc.setLocalDescription(offer);
      await signalsRef(state.liveId,viewerUid).set({type:'offer',from:state.user.uid,to:viewerUid,sdp:offer.sdp,t:Date.now()});
      if(!pc._unsub){
        pc._unsub=signalsRef(state.liveId,viewerUid).onSnapshot(async doc=>{
          if(!doc.exists)return;
          const d=doc.data();
          if(d.type==='answer'&&d.sdp&&pc.signalingState!=='stable'){
            try{await pc.setRemoteDescription({type:'answer',sdp:d.sdp});}catch(e){}
          }
        });
        pc._iceUnsub=signalsRef(state.liveId,viewerUid).collection('ice').onSnapshot(snap=>{
          snap.docChanges().forEach(async ch=>{
            if(ch.type!=='added')return;
            const d=ch.doc.data();
            if(d.from===viewerUid&&d.candidate){try{await pc.addIceCandidate(d.candidate);}catch(e){}}
          });
        });
      }
    }catch(e){console.warn('host peer',e);}
  }

  async function startViewerWebRTC(liveId){
    if(state.isHost||!state.user)return;
    stopAllPeers();
    try{
      const liveDoc=await fbDb.collection('lives').doc(liveId).get();
      const host=liveDoc.exists?liveDoc.data().hostUid:null;
      if(!host)return;
      try{await signalsRef(liveId,state.user.uid).delete();}catch(e){}
      const pc=new RTCPeerConnection(iceServers);
      pcs['host']=pc;
      wireIce(pc,state.user.uid);
      pc.ontrack=ev=>{
        const video=document.getElementById('cam');
        const fallback=document.querySelector('.cam-fallback');
        if(video){
          const stream=ev.streams[0]||new MediaStream([ev.track]);
          video.srcObject=stream;video.setAttribute('playsinline','');video.muted=false;video.volume=1;video.style.transform='none';
          const play=()=>video.play().catch(()=>{});play();
          window._unlockLiveSound=()=>{video.muted=false;video.volume=1;play();const hint=document.getElementById('soundHint');if(hint)hint.style.display='none';};
          document.body.addEventListener('touchstart',window._unlockLiveSound,{once:true});
          document.body.addEventListener('click',window._unlockLiveSound,{once:true});
        }
        if(fallback)fallback.style.display='none';
        state.demo=false;
        const hint=document.getElementById('soundHint');if(hint)hint.style.display='block';
      };
      signalUnsub=signalsRef(liveId,state.user.uid).onSnapshot(async doc=>{
        if(!doc.exists)return;
        const d=doc.data();
        if(d.type==='offer'&&d.sdp){
          try{
            if(!pc.currentRemoteDescription){
              await pc.setRemoteDescription({type:'offer',sdp:d.sdp});
              const answer=await pc.createAnswer();
              await pc.setLocalDescription(answer);
              await signalsRef(liveId,state.user.uid).set({type:'answer',from:state.user.uid,to:host,sdp:answer.sdp,t:Date.now()},{merge:true});
            }
          }catch(e){console.warn('answer',e);}
        }
      });
      signalsRef(liveId,state.user.uid).collection('ice').onSnapshot(snap=>{
        snap.docChanges().forEach(async ch=>{
          if(ch.type!=='added')return;
          const d=ch.doc.data();
          if(d.from===host&&d.candidate){try{await pc.addIceCandidate(d.candidate);}catch(e){}}
        });
      });
    }catch(e){console.warn('viewer webrtc',e);}
  }

  function startViewerGrowth(){
    stopViewerGrowth();
    if(!useAutoBots()){state.botViewers=0;state.viewers=state.realViewers;updateViewerLabel();return;}
    state.botViewers=0;state.viewers=state.realViewers;updateViewerLabel();
    if(state.liveId)fbDb.collection('lives').doc(state.liveId).update({viewerCount:state.viewers,realViewerCount:state.realViewers}).catch(()=>{});
    viewerTimer=setInterval(()=>{
      if(!useAutoBots()||state.screen==='home')return;
      const v=state.botViewers;
      let add=0;
      if(v<3)add=Math.random()<0.4?1:0;
      else if(v<10)add=Math.random()<0.45?1:0;
      else if(v<25)add=Math.random()<0.55?(1+Math.floor(Math.random()*2)):0;
      else if(v<80)add=1+Math.floor(Math.random()*2);
      else add=1+Math.floor(Math.random()*4);
      if(v>100&&Math.random()<0.12)add=-Math.floor(1+Math.random()*Math.min(15,v*0.02));
      state.botViewers=Math.max(0,state.botViewers+add);
      state.viewers=state.realViewers+state.botViewers;
      updateViewerLabel();
      if(state.liveId&&Math.random()<0.4){
        fbDb.collection('lives').doc(state.liveId).update({viewerCount:state.viewers,realViewerCount:state.realViewers}).catch(()=>{});
      }
    },1600);
  }
  function stopViewerGrowth(){if(viewerTimer){clearInterval(viewerTimer);viewerTimer=null;}}
  function updateViewerLabel(){const el=document.getElementById('viewerCount');if(el)el.textContent=formatViewers(state.viewers);}

  function subscribeChat(liveId){
    if(chatUnsub)chatUnsub();
    chatUnsub=fbDb.collection('lives').doc(liveId).collection('messages').orderBy('ts','desc').limit(80)
      .onSnapshot(snap=>{
        const rows=[];snap.forEach(d=>rows.push({id:d.id,...d.data()}));rows.reverse();
        const remote=[],seen=new Set();
        rows.forEach(r=>{
          const key=((r.name||'')+'|'+(r.text||'')).toLowerCase();
          if(useAutoBots()&&r.bot){
            if(chatLines.some(c=>c.local&&c.bot&&(c.user+'|'+c.text).toLowerCase()===key))return;
          }
          if(seen.has(key))return;seen.add(key);
          remote.push({id:r.id,user:r.name||'user',color:r.color||randColor(),text:r.text||'',local:false,bot:!!r.bot,gift:!!r.gift,giftEmoji:r.giftEmoji||''});
          if(r.gift&&r.giftEmoji&&r.ts&&(Date.now()-r.ts)<8000){
            if(!window._seenGifts)window._seenGifts=new Set();
            if(!window._seenGifts.has(r.id)){window._seenGifts.add(r.id);showGiftAnim(r.giftEmoji,(r.name||'')+' sent '+(r.giftName||'gift'));}
          }
        });
        const remoteKeys=new Set(remote.map(r=>(r.user+'|'+r.text).toLowerCase()));
        const locals=chatLines.filter(c=>{
          if(!c.local)return false;
          if(c.bot)return useAutoBots();
          if(remoteKeys.has((c.user+'|'+c.text).toLowerCase()))return false;
          return true;
        });
        chatLines.length=0;remote.forEach(r=>chatLines.push(r));
        locals.slice(-20).forEach(l=>{if(remoteKeys.has((l.user+'|'+l.text).toLowerCase()))return;chatLines.push(l);});
        while(chatLines.length>90)chatLines.shift();
        schedulePaintChat();
      },err=>console.warn('chat',err));
  }

  let botWriteQueue=[],botWriteTimer=null;
  function flushBotWrites(){
    botWriteTimer=null;
    if(!state.liveId||!state.isHost){botWriteQueue=[];return;}
    const batch=botWriteQueue.splice(0,4);
    batch.forEach(m=>{
      fbDb.collection('lives').doc(state.liveId).collection('messages').add({
        uid:'bot',name:m.user,text:m.text,color:m.color,bot:true,ts:Date.now()
      }).catch(()=>{});
    });
    if(botWriteQueue.length)botWriteTimer=setTimeout(flushBotWrites,350);
  }
  function pushLocalChat(user,text,color,opts){
    const o=opts||{};const col=color||randColor();
    const last=chatLines[chatLines.length-1];
    if(last&&last.user===user&&last.text===text)return;
    chatLines.push({id:'local_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),user,color:col,text,local:true,bot:!!o.bot});
    while(chatLines.length>90)chatLines.shift();
    schedulePaintChat();
    if(o.bot&&useAutoBots()&&state.liveId){
      botWriteQueue.push({user,text,color:col});
      if(!botWriteTimer)botWriteTimer=setTimeout(flushBotWrites,300);
    }
  }
  function schedulePaintChat(){
    if(paintScheduled)return;paintScheduled=true;
    requestAnimationFrame(()=>{paintScheduled=false;paintChat();});
  }
  function paintChat(){
    const list=document.getElementById('chatList');if(!list)return;
    const slice=chatLines.slice(-45);
    const lastId=slice.length?slice[slice.length-1].id:null;
    const html=slice.map((c,i)=>{
      const isNew=i>=slice.length-3;
      return '<div class="chat-line'+(isNew?' new':'')+'"><span class="chat-user" style="color:'+c.color+'">'+escapeHtml(c.user)+'</span><span class="chat-text">'+escapeHtml(c.text)+'</span></div>';
    }).join('');
    if(list.dataset.lastId===lastId&&list.childElementCount===slice.length)return;
    list.dataset.lastId=lastId||'';list.innerHTML=html;list.scrollTop=list.scrollHeight;
  }

  function burstGreetings(){
    setTimeout(()=>{
      if(!useAutoBots())return;
      const total=3+Math.floor(Math.random()*4);
      for(let i=0;i<total;i++){
        setTimeout(()=>{
          if(!useAutoBots())return;
          pushLocalChat(randName(),GREET_POOL[Math.floor(Math.random()*GREET_POOL.length)],randColor(),{bot:true});
        },i*(500+Math.random()*500));
      }
    },2000);
  }

  async function sendUserChat(){
    const input=document.getElementById('chatInput');
    if(!input||!state.user||!state.liveId)return;
    const text=(input.value||'').trim();if(!text)return;
    input.value='';
    pushLocalChat(state.user.name,text,'#fff',{bot:false});
    try{
      await fbDb.collection('lives').doc(state.liveId).collection('messages').add({
        uid:state.user.uid,name:state.user.name,text,color:'#ffffff',bot:false,ts:Date.now()
      });
    }catch(e){}
  }

  function startBotChatEngine(){
    stopBotChatEngine();
    if(!useAutoBots())return;
    const tick=()=>{
      if(!useAutoBots())return;
      const v=Math.max(0,Math.floor(state.viewers||0));
      let delay=v<=0?2600:v<10?1500+Math.random()*700:v<50?700+Math.random()*300:300+Math.random()*150;
      chatTimer=setTimeout(()=>{
        chatTimer=null;
        if(!useAutoBots())return;
        const viewers=Math.max(0,Math.floor(state.viewers||0));
        if(viewers<=0){tick();return;}
        let n=viewers<5?(Math.random()<0.4?1:0):viewers<30?1:1+Math.floor(Math.random()*2);
        if(Date.now()<state.chatBurstUntil)n+=1;
        n=Math.min(n,8);
        for(let i=0;i<n;i++){
          setTimeout(()=>{
            if(!useAutoBots()||(state.viewers||0)<=0)return;
            const early=(state.viewers||0)<20&&Math.random()<0.4;
            pushLocalChat(randName(),early?GREET_POOL[Math.floor(Math.random()*GREET_POOL.length)]:randChat(),randColor(),{bot:true});
          },Math.random()*400);
        }
        tick();
      },delay);
    };
    tick();
  }
  function stopBotChatEngine(){if(chatTimer){clearTimeout(chatTimer);clearInterval(chatTimer);chatTimer=null;}}

  function spawnFloat(emoji){
    const root=document.getElementById('floats');if(!root)return;
    const el=document.createElement('div');el.className='float-emoji';el.textContent=emoji;
    el.style.setProperty('--dx',(Math.random()*40-20)+'px');root.appendChild(el);
    setTimeout(()=>el.remove(),2300);
  }
  function spamReaction(packKey,intensity){
    if(!useAutoBots())return;
    const pack=SPAM_PACKS[packKey]||SPAM_PACKS.w;
    const count=Math.floor(12+intensity*40);
    state.chatBurstUntil=Date.now()+1400;
    for(let i=0;i<count;i++){
      setTimeout(()=>{
        const msg=pack[Math.floor(Math.random()*pack.length)];
        pushLocalChat(randName(),msg,randColor(),{bot:true});
        if(/[🔥❤️💕😂😭💀👏]/.test(msg)||Math.random()<0.2)spawnFloat(msg.match(/[🔥❤️💕😂😭💀👏🙌👀✨💯🚀👑]/)?.[0]||'❤️');
      },Math.random()*1100);
    }
    state.botViewers+=Math.floor(20+intensity*120);
    state.viewers=state.realViewers+state.botViewers;
    updateViewerLabel();
  }

  function setMicStatus(t,on){
    const mic=document.getElementById('micStatus');if(!mic)return;
    mic.textContent=t;mic.className=on?'mic-status on':'mic-status';
  }
  function startListening(){
    if(!useAutoBots())return;
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setMicStatus('Mic: voice cmds unsupported',false);return;}
    try{
      if(recognition){try{recognition.onend=null;recognition.stop();}catch(e){}recognition=null;}
      recognition=new SR();
      recognition.continuous=true;recognition.interimResults=true;recognition.lang='en-US';
      recognition.onstart=()=>setMicStatus('Mic: listening…',true);
      recognition.onerror=ev=>{
        const code=(ev&&ev.error)||'';
        if(code==='not-allowed')setMicStatus('Mic: blocked — allow mic',false);
        else if(code==='no-speech')setMicStatus('Mic: listening…',true);
        else setMicStatus('Mic: off (tap to retry)',false);
      };
      recognition.onend=()=>{
        setMicStatus('Mic: paused (tap)',false);
        if(state.screen==='live'&&state.isHost)setTimeout(()=>{try{if(recognition)recognition.start();}catch(e){}},900);
      };
      recognition.onresult=ev=>{
        let finalText='';
        for(let i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal)finalText+=ev.results[i][0].transcript;
        if(finalText)handleVoice(finalText.trim());
      };
      setMicStatus('Mic: starting…',false);
      recognition.start();
      setTimeout(()=>{
        const mic=document.getElementById('micStatus');
        if(mic&&/starting/i.test(mic.textContent||''))setMicStatus('Mic: ready (tap if silent)',false);
      },2000);
    }catch(e){setMicStatus('Mic: blocked (tap to retry)',false);}
  }
  function stopListening(){if(recognition){try{recognition.onend=null;recognition.stop();}catch(e){}recognition=null;}}
  let lastTriggerAt=0;
  function handleVoice(text){
    const now=Date.now();if(now-lastTriggerAt<1800)return;
    for(const tr of VOICE_TRIGGERS){if(tr.re.test(text)){lastTriggerAt=now;spamReaction(tr.pack,tr.intensity);return;}}
  }

  async function startCamera(facing){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return false;
    const mode=facing||state.facingMode||'user';state.facingMode=mode;
    try{
      stopCamera();
      const wantAudio=!!state.isHost;
      const audioOpts=wantAudio?{echoCancellation:true,noiseSuppression:true,autoGainControl:true}:false;
      try{
        state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode},width:{ideal:1280},height:{ideal:720}},audio:audioOpts});
      }catch(e){
        state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:mode},audio:audioOpts});
      }
      if(state.stream)state.stream.getAudioTracks().forEach(t=>{t.enabled=!state.muted;});
      applyMuteState();return true;
    }catch(e){
      try{state.stream=await navigator.mediaDevices.getUserMedia({video:true,audio:!!state.isHost});applyMuteState();return true;}
      catch(e2){return false;}
    }
  }
  function stopCamera(){if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null;}}
  function applyMuteState(){
    if(!state.stream)return;
    state.stream.getAudioTracks().forEach(t=>{t.enabled=!state.muted;});
    Object.values(pcs).forEach(pc=>{
      try{pc.getSenders().forEach(s=>{if(s.track&&s.track.kind==='audio')s.track.enabled=!state.muted;});}catch(e){}
    });
  }
  function toggleMute(){
    state.muted=!state.muted;applyMuteState();
    const btn=document.getElementById('muteBtn');if(btn)btn.textContent=state.muted?'🔇':'🎤';
  }
  function attachCam(){
    const video=document.getElementById('cam');
    if(video&&state.stream){
      video.srcObject=state.stream;video.muted=true;
      video.style.transform=state.facingMode==='user'?'scaleX(-1)':'none';
      video.play().catch(()=>{});
    }
  }
  async function flipCamera(){
    if(!state.isHost)return;
    const next=state.facingMode==='user'?'environment':'user';
    const ok=await startCamera(next);
    if(ok){
      state.demo=false;attachCam();
      Object.keys(pcs).forEach(uid=>{
        if(uid==='host')return;
        try{pcs[uid].close();}catch(e){}delete pcs[uid];ensureHostPeer(uid);
      });
    }
  }

  function stopInjectedBotEngine(){if(injectedChatTimer){clearTimeout(injectedChatTimer);injectedChatTimer=null;}}
  function startInjectedBotEngine(){
    stopInjectedBotEngine();
    if(!state.liveId||!canAddBots())return;
    const chatTick=()=>{
      if(!state.liveId||!canAddBots())return;
      const n=(state.injectedBots||[]).length;
      if(n<=0){injectedChatTimer=setTimeout(chatTick,2000);return;}
      const delay=n<8?1200+Math.random()*600:400+Math.random()*300;
      const msgs=n<8?(Math.random()<0.6?1:0):1+Math.floor(Math.random()*2);
      for(let i=0;i<msgs;i++){
        setTimeout(()=>{
          if(!state.liveId||!(state.injectedBots||[]).length)return;
          const bot=state.injectedBots[Math.floor(Math.random()*state.injectedBots.length)];
          if(!bot)return;
          fbDb.collection('lives').doc(state.liveId).collection('messages').add({
            uid:bot.id,name:bot.name,
            text:n<12&&Math.random()<0.4?GREET_POOL[Math.floor(Math.random()*GREET_POOL.length)]:randChat(),
            color:bot.color||randColor(),bot:true,ts:Date.now()
          }).catch(()=>{});
        },Math.random()*400);
      }
      injectedChatTimer=setTimeout(chatTick,delay);
    };
    chatTick();
  }

  async function addBotToCurrentLive(silent){
    if(!canAddBots()){if(!silent)alert('Be the host (or owner) to add bots.');return;}
    if(!state.liveId){if(!silent)alert('Start or join a live first');return;}
    const botId='bot_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const botName=randName();const color=randColor();
    try{
      await fbDb.collection('lives').doc(state.liveId).collection('viewers').doc(botId).set({name:botName,isBot:true,joinedAt:Date.now()});
      if(!silent){
        await fbDb.collection('lives').doc(state.liveId).collection('messages').add({
          uid:botId,name:botName,
          text:Math.random()<0.7?GREET_POOL[Math.floor(Math.random()*GREET_POOL.length)]:randChat(),
          color,bot:true,ts:Date.now()
        });
      }
      state.injectedBots=state.injectedBots||[];
      state.injectedBots.push({id:botId,name:botName,color});
      if(!injectedChatTimer)startInjectedBotEngine();
      if(useAutoBots()){
        state.botViewers=(state.botViewers||0)+1;
        state.viewers=state.realViewers+state.botViewers;
        updateViewerLabel();
        if(!chatTimer)startBotChatEngine();
      }
      fbDb.collection('lives').doc(state.liveId).update({viewerCount:firebase.firestore.FieldValue.increment(1),hb:Date.now()}).catch(()=>{});
      if(!silent)setDebug('Bot added: '+botName,true);
    }catch(e){
      console.warn('add bot',e);
      const msg=(e&&e.message)||String(e);
      if(!silent){
        if(/permission|insufficient/i.test(msg)){
          alert('Bot failed: Firestore RULES blocked write.\nPublish the rules!');
          setDebug('Bot write BLOCKED by rules',false);
        }else alert('Bot failed: '+msg);
      }
    }
  }

  function render(){
    const app=document.getElementById('app');
    if(state.screen==='home'){
      const lives=state.lives||[];
      const listHtml=lives.length===0
        ?'<div class="empty">No one is live right now.<br/>Be the first — hit Go Live.<br/><span style="font-size:12px;opacity:.7">If you ARE live on another phone, fix Firebase Rules (yellow box).</span></div>'
        :lives.map(l=>{
          const vc=formatViewers(l.viewerCount||0);
          const mine=state.user&&l.hostUid===state.user.uid;
          const canKill=state.user&&(state.user.isOwner||mine);
          return '<div class="live-card"><div class="live-card-info"><div class="live-card-title">'+escapeHtml(l.title||'Live')+'</div><div class="live-card-meta"><span class="live-dot-sm"></span>'+escapeHtml(l.hostName||'Host')+' · '+vc+' watching'+(mine?' · you':'')+'</div></div>'+(canKill?'<button class="end-btn" data-kill="'+l.id+'" style="width:32px;height:32px;flex:none;">×</button>':'')+'<button class="join-btn" data-id="'+l.id+'">'+(mine?'Open':'Join')+'</button></div>';
        }).join('');
      const dbgClass=state.debugOk===true?' ok':state.debugOk===false?' bad':'';
      app.innerHTML='<div class="home"><div class="home-head"><div class="logo">Broadcast</div><div class="home-title">GO <span>LIVE</span></div><div class="user-row">'+(state.user?'Signed in as <strong>'+escapeHtml(state.user.name)+'</strong> · <span style="color:#ffc14a">'+(state.user.isOwner?'∞':formatCoins(state.coins))+' 🪙</span>'+(state.user.isOwner?' · <span style="color:var(--green)">owner</span>':''):'Sign in to go live or join')+'</div></div><div class="debug-box'+dbgClass+'" id="debugBox">'+escapeHtml(state.debug||'')+'</div><div class="lives-label">Live now</div><div class="lives-list">'+listHtml+'</div>'+(state.error?'<p class="err">'+escapeHtml(state.error)+'</p>':'')+'<div class="bottom-bar"><button class="go-live" id="goLiveBtn">'+(state.user?'● Go Live':'Sign in to Go Live')+'</button>'+(state.user?'<button class="ghost-btn" id="signOutBtn">Sign out</button>':'<button class="ghost-btn" id="signInBtn">Sign in with Google</button>')+'</div></div>'+(state.showNameModal?'<div class="modal-overlay" id="modalBg"><div class="modal-card" onclick="event.stopPropagation()"><h2>Name your live</h2><p>This title shows on the list for everyone.</p><input class="input" id="titleInput" maxlength="48" value="'+escapeHtml(state.streamTitle)+'" placeholder="My Live" /><button class="go-live" id="confirmLive">Start Live</button><button class="ghost-btn" id="cancelLive" style="margin-top:8px;">Cancel</button></div></div>':'');

      document.getElementById('goLiveBtn').onclick=()=>{if(!state.user)signIn();else openNameModal();};
      const so=document.getElementById('signOutBtn');if(so)so.onclick=signOut;
      const si=document.getElementById('signInBtn');if(si)si.onclick=signIn;
      document.querySelectorAll('.join-btn').forEach(btn=>{btn.onclick=()=>joinLive(btn.getAttribute('data-id'));});
      document.querySelectorAll('[data-kill]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();forceEndLive(btn.getAttribute('data-kill'));};});
      if(state.showNameModal){
        document.getElementById('modalBg').onclick=()=>{state.showNameModal=false;render();};
        document.getElementById('cancelLive').onclick=()=>{state.showNameModal=false;render();};
        document.getElementById('confirmLive').onclick=()=>{state.streamTitle=document.getElementById('titleInput').value;confirmGoLive();};
      }
      return;
    }

    const isWatch=state.screen==='watch';
    const coinLabel=state.user?(state.user.isOwner?'∞ 🪙':formatCoins(state.coins)+' 🪙'):'';
    const showBotBtn=canAddBots();
    app.innerHTML='<div class="stage"><div class="video-wrap"><video id="cam" playsinline autoplay muted></video>'+(state.demo&&state.isHost?'<div class="cam-fallback"><div>Camera not on</div><div style="opacity:.7;margin-top:8px;max-width:260px">Allow camera, then tap retry.</div><button class="retry-cam" id="retryCam">Enable camera</button></div>':'')+(isWatch&&state.demo?'<div class="cam-fallback"><div><strong>'+escapeHtml(state.hostName)+'</strong> is live</div><div style="opacity:.7;margin-top:8px;max-width:260px">Connecting video… Tap for sound if needed.</div></div>':'')+'<button id="soundHint" style="display:none;position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:25;border:none;border-radius:999px;padding:10px 16px;background:rgba(0,0,0,.7);color:#fff;font-weight:700;font-size:13px;">Tap for sound 🔊</button><div class="topbar"><div class="live-pill"><div class="live-dot"></div><div class="live-label">LIVE</div><div class="stream-title">'+escapeHtml(state.title)+'</div><div class="viewers"><span id="viewerCount">'+formatViewers(state.viewers)+'</span> watching</div></div><div class="top-actions">'+(coinLabel?'<div class="coins-pill">'+coinLabel+'</div>':'')+(showBotBtn?'<button class="b-btn" id="bBtn" title="Add bot">b</button>':'')+(state.isHost?'<button class="flip-btn" id="muteBtn">'+(state.muted?'🔇':'🎤')+'</button>':'')+(state.isHost?'<button class="flip-btn" id="flipBtn">⟲</button>':'')+'<button class="end-btn" id="endBtn">×</button></div></div><div class="floats" id="floats"></div></div><div class="chat-wrap">'+(useAutoBots()?'<div class="mic-status" id="micStatus">Mic: starting…</div>':'')+'<div class="chat-list" id="chatList"></div><div class="chat-input-row"><input class="chat-input" id="chatInput" placeholder="Say something…" maxlength="120" /><button class="gift-btn" id="giftBtn">🎁</button><button class="chat-send" id="chatSend">Send</button></div>'+(state.showGifts?'<div class="gift-panel"><div class="gift-panel-head"><strong>Gifts</strong><span class="coins-pill">'+coinLabel+'</span><button class="ghost-btn" id="closeGifts" style="width:auto;padding:6px 12px;">Close</button></div><div class="gift-grid">'+GIFTS.map(g=>'<div class="gift-item" data-gift="'+g.id+'"><div class="gift-emoji">'+g.e+'</div><div class="gift-name">'+escapeHtml(g.n)+'</div><div class="gift-cost">'+formatCoins(g.c)+' 🪙</div></div>').join('')+'</div></div>':'')+'</div></div>';

    document.getElementById('endBtn').onclick=()=>leaveCurrentLive(true);
    const bBtn=document.getElementById('bBtn');if(bBtn)bBtn.onclick=()=>addBotToCurrentLive(false);
    const flip=document.getElementById('flipBtn');if(flip)flip.onclick=flipCamera;
    const mute=document.getElementById('muteBtn');if(mute)mute.onclick=toggleMute;
    const retryCam=document.getElementById('retryCam');
    if(retryCam)retryCam.onclick=async()=>{
      const ok=await startCamera(state.facingMode||'user');state.demo=!ok;
      if(ok){render();attachCam();Object.keys(pcs).forEach(uid=>{if(uid==='host')return;try{pcs[uid].close();}catch(e){}delete pcs[uid];ensureHostPeer(uid);});}
      else alert('Camera blocked. Allow Camera in browser settings.');
    };
    const soundHint=document.getElementById('soundHint');
    if(soundHint)soundHint.onclick=()=>{const video=document.getElementById('cam');if(video){video.muted=false;video.volume=1;video.play().catch(()=>{});}soundHint.style.display='none';};
    const micEl=document.getElementById('micStatus');if(micEl)micEl.onclick=()=>startListening();
    document.getElementById('chatSend').onclick=sendUserChat;
    document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendUserChat();});
    const giftBtn=document.getElementById('giftBtn');if(giftBtn)giftBtn.onclick=()=>{state.showGifts=!state.showGifts;render();};
    const closeGifts=document.getElementById('closeGifts');if(closeGifts)closeGifts.onclick=()=>{state.showGifts=false;render();};
    document.querySelectorAll('[data-gift]').forEach(el=>{el.onclick=()=>{const g=GIFTS.find(x=>x.id===el.getAttribute('data-gift'));if(g)sendGift(g);};});
    attachCam();paintChat();updateViewerLabel();
  }

  if(fbReady)subscribeLives();
  render();
})();
</script>
</body>
</html>
