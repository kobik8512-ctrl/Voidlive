<style>
  :root {
    --bg: #0a0a0c;
    --panel: #14141a;
    --line: #2a2a35;
    --ink: #f2f2f5;
    --muted: #8b8b9a;
    --red: #ff3b4a;
    --pink: #ff2d55;
    --green: #3dff9a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--ink);

  #app { height: 100%; width: 100%; position: relative; }

  .logo { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
  .home-title { font-size: 28px; font-weight: 800; margin-top: 4px; }
  .home-title span { color: var(--red); }
  .user-row { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .user-row strong { color: var(--green); }

  .lives-label {
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin: 8px 0 8px;
  }
  .lives-list {
    flex: 1; overflow-y: auto; min-height: 0;
    display: flex; flex-direction: column; gap: 10px;
    padding-bottom: 12px;
  }
  .live-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .live-card-info { flex: 1; min-width: 0; }
  .live-card-title {
    font-weight: 700; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .live-card-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .live-dot-sm {
    width: 8px; height: 8px; border-radius: 50%; background: var(--red);
    display: inline-block; margin-right: 5px;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,59,74,.55); }
    70% { box-shadow: 0 0 0 8px rgba(255,59,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,59,74,0); }
  }
  .join-btn {
    flex: none; border: none; border-radius: 999px;
    padding: 8px 14px; background: var(--pink); color: #fff;
    font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .empty {
    text-align: center; color: var(--muted); font-size: 14px;
    padding: 40px 16px; line-height: 1.5;
  }

  .bottom-bar { padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .go-live {
    width: 100%; padding: 16px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #ff2d55, #ff5c8a);
    color: #fff; font-size: 16px; font-weight: 800; letter-spacing: .04em;
    text-transform: uppercase; cursor: pointer;
    box-shadow: 0 10px 32px rgba(255,45,85,.3);
  }
  .ghost-btn {
    width: 100%; padding: 12px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .err { color: var(--red); font-size: 13px; text-align: center; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50; padding: 16px;

  .modal-card {
    width: 100%; max-width: 420px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 18px;
    padding: 18px; margin-bottom: env(safe-area-inset-bottom);

  .modal-card h2 { font-size: 18px; margin-bottom: 6px; }
  .modal-card p { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: #0c0c10; color: #fff;
    font-size: 15px; outline: none; margin-bottom: 12px;
  }

  .stage { height: 100%; display: flex; flex-direction: column; background: #000; }
  .video-wrap { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
  #cam {
    width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1); background: #111;
  }
  .cam-fallback {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; color: var(--muted);
    font-size: 14px; padding: 24px; line-height: 1.5;
  }
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;

    background: linear-gradient(to bottom, rgba(0,0,0,.65), transparent);

  .live-pill {
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px; padding: 6px 12px 6px 8px;
    backdrop-filter: blur(8px); max-width: 75%;
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1.4s infinite; flex: none; }
  .live-label { font-size: 11px; font-weight: 800; letter-spacing: .12em; flex: none; }
  .stream-title {
    font-size: 12px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 120px;
  }
  .viewers { font-size: 13px; font-weight: 700; flex: none; }
  .top-actions { display: flex; gap: 8px; flex: none; }
  .end-btn, .flip-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.55);
    color: #fff; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .flip-btn { font-size: 15px; }
  .b-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25); background: rgba(255,45,85,.85);
    color: #fff; font-size: 14px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .floats {
    position: absolute; right: 10px; bottom: 38%; width: 60px; height: 40%;
    pointer-events: none; z-index: 15; overflow: hidden;
  }
  .float-emoji {
    position: absolute; bottom: 0; left: 50%; font-size: 22px;
    animation: floatUp 2.2s ease-out forwards; opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translate(-50%,0) scale(.6); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), -180px) scale(1.15); opacity: 0; }
  }
  .chat-wrap {
    position: relative; height: min(38vh, 320px);
    background: linear-gradient(to top, rgba(0,0,0,.92) 70%, rgba(0,0,0,.55));
    display: flex; flex-direction: column; z-index: 10;

  .chat-list {
    flex: 1; overflow: hidden; padding: 10px 12px 6px;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;
    mask-image: linear-gradient(to bottom, transparent, #000 18%);
  }
  .chat-line { font-size: 13px; line-height: 1.3; word-break: break-word; }
  .chat-line.new { animation: chatIn .15s ease-out; }
  @keyframes chatIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .chat-user { font-weight: 700; margin-right: 6px; }
  .chat-input-row { display: flex; gap: 8px; padding: 8px 12px max(10px, env(safe-area-inset-bottom)); }
  .chat-input {
    flex: 1; border: 1px solid var(--line); background: rgba(255,255,255,.06);
    color: #fff; border-radius: 999px; padding: 10px 14px; font-size: 14px; outline: none;
  }
  .chat-send {
    border: none; border-radius: 999px; padding: 0 16px;
    background: var(--pink); color: #fff; font-weight: 700; cursor: pointer;
  }
  .mic-status {
    position: absolute; top: -28px; left: 12px; font-size: 11px; color: var(--muted);
    background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 6px;
  }
  .mic-status.on { color: var(--green); }

        if (!prev.empty) await batch.commit();
      } catch (e) { /* ignore cleanup errors */ }

      const ref = fbDb.collection('lives').doc();
      const isOwnerStream = !!state.user.isOwner;
      await ref.set({
        hostUid: state.user.uid,
        hostName: state.user.name,
        hostEmail: state.user.email || '',
        title: title,
        status: 'live',
        isOwnerStream: isOwnerStream,
        viewerCount: 0,
        realViewerCount: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      state.liveId = ref.id;
      state.isHost = true;
      state.isOwnerStream = isOwnerStream;
      state.hostName = state.user.name;
      state.title = title;
      state.viewers = 0;
      state.realViewers = 0;
      state.botViewers = 0;
      state.screen = 'live';
      state.error = null;
      chatLines.length = 0;

      const camOk = await startCamera();
      state.demo = !camOk;
      render();
      attachCam();
      subscribeToLive(ref.id);
      subscribeChat(ref.id);
      await joinPresence(ref.id);
      startViewerGrowth();
      if (isOwnerStream) {
        startBotChatEngine();
        burstGreetings();
      }
      startListening();
    } catch (err) {
      console.error('go live failed', err);
      const msg = (err && err.message) || String(err);
      if (/permission|insufficient|Missing or insufficient/i.test(msg)) {
        state.error = 'Firestore blocked the write. Update Firebase Rules for collection "lives" (see instructions).';
      } else {
        state.error = 'Could not start live: ' + msg;
      }
      state.showNameModal = false;
      state.screen = 'home';
      render();
    }
  }

  async function joinLive(liveId) {
    if (!fbReady || !state.user) { signIn(); return; }
    if (state.liveId === liveId) return;
    await leaveCurrentLive(false);

    const doc = await fbDb.collection('lives').doc(liveId).get();
    if (!doc.exists || doc.data().status !== 'live') {
      state.error = 'That live ended.';
      render();
      return;
    }
    const data = doc.data();
    state.liveId = liveId;
    state.isHost = data.hostUid === state.user.uid;
    state.isOwnerStream = !!data.isOwnerStream;
    state.hostName = data.hostName || 'Host';
    state.title = data.title || 'Live';
    state.viewers = data.viewerCount || 0;
    state.realViewers = data.realViewerCount || 0;
    state.botViewers = 0;
    state.screen = state.isHost ? 'live' : 'watch';
    state.demo = true;
    chatLines.length = 0;
    render();
    subscribeToLive(liveId);
    subscribeChat(liveId);
    await joinPresence(liveId);
    if (state.isHost && state.isOwnerStream) {
      startViewerGrowth();
      startBotChatEngine();
      const camOk = await startCamera();
      state.demo = !camOk;
      render();
      attachCam();
      startListening();
    } else if (!state.isHost) {
      // Viewer: receive host camera + mic via WebRTC
      setTimeout(() => startViewerWebRTC(liveId), 400);
    }
  }

  async function leaveCurrentLive(goHome) {
    stopListening();
    stopBotChatEngine();
    stopViewerGrowth();
    stopAllPeers();
    stopCamera();
    if (liveUnsub) { liveUnsub(); liveUnsub = null; }
    if (chatUnsub) { chatUnsub(); chatUnsub = null; }
    if (presenceUnsub) { presenceUnsub(); presenceUnsub = null; }

    if (fbReady && state.liveId && state.user) {
      try {
        await fbDb.collection('lives').doc(state.liveId).collection('viewers').doc(state.user.uid).delete();
      } catch (e) {}
      if (state.isHost) {
        try {
          await fbDb.collection('lives').doc(state.liveId).update({
            status: 'ended',
            endedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (e) {}
      }
    }
    state.liveId = null;
    state.isHost = false;
    state.isOwnerStream = false;
    state.viewers = 0;
    state.botViewers = 0;
    state.realViewers = 0;
    chatLines.length = 0;
    if (goHome !== false) {
      state.screen = 'home';
      render();
    }
  }

  function subscribeToLive(liveId) {
    if (liveUnsub) liveUnsub();
    liveUnsub = fbDb.collection('lives').doc(liveId).onSnapshot(doc => {
      if (!doc.exists) return;
      const d = doc.data();
      if (d.status !== 'live' && !state.isHost) {
        state.error = 'Live ended.';
        leaveCurrentLive(true);
        return;
      }
      state.title = d.title || state.title;
      state.hostName = d.hostName || state.hostName;
      state.isOwnerStream = !!d.isOwnerStream;
      if (!state.isOwnerStream || !state.isHost) {
        state.viewers = d.viewerCount || 0;
        state.realViewers = d.realViewerCount || 0;
        updateViewerLabel();
      }
    });
  }

  async function joinPresence(liveId) {
    if (!state.user) return;
    const vRef = fbDb.collection('lives').doc(liveId).collection('viewers').doc(state.user.uid);
    // Host must never appear as a watcher
    if (state.isHost) {
      try { await vRef.delete(); } catch (e) {}
    } else {
      await vRef.set({
        name: state.user.name,
        joinedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    if (presenceUnsub) presenceUnsub();
    presenceUnsub = fbDb.collection('lives').doc(liveId).collection('viewers')
      .onSnapshot(async snap => {
        let real = 0;
        snap.forEach(doc => {
          // Never count the host uid
          if (doc.id === (state.user && state.user.uid) && state.isHost) return;
          // Also skip if this doc is the live host
          real++;
        });
        // Host-side: exclude own uid if leftover
        if (state.isHost) {
          real = 0;
          snap.forEach(doc => {
            if (doc.id !== state.user.uid) real++;
          });
        } else {
          real = snap.size;
        }

        state.realViewers = real;
        if (state.isOwnerStream && state.isHost) {
          state.viewers = state.realViewers + state.botViewers;
        } else {
          state.viewers = real;
        }
        updateViewerLabel();
        if (state.isHost) {
          try {
            await fbDb.collection('lives').doc(liveId).update({
              realViewerCount: real,
              viewerCount: state.isOwnerStream ? (real + state.botViewers) : real
            });
          } catch (e) {}
          const active = new Set();
          snap.forEach(doc => {
            if (doc.id !== state.user.uid) {
              active.add(doc.id);
              // Don't try WebRTC to fake bots
              if (!doc.data().isBot) ensureHostPeer(doc.id);
            }
          });
          // Viewer left → close their WebRTC so rejoin can reconnect cleanly
          Object.keys(pcs).forEach(uid => {
            if (uid === 'host') return;
            if (!active.has(uid)) {
              try {
                if (pcs[uid]._unsub) pcs[uid]._unsub();
                if (pcs[uid]._iceUnsub) pcs[uid]._iceUnsub();
                pcs[uid].close();
              } catch (e) {}
              delete pcs[uid];
              // Clear old signal so next join gets a fresh offer
              signalsRef(liveId, uid).delete().catch(() => {});
            }
          });
        }
      });
  }

  // ===== WebRTC: host camera/mic → viewers =====
  const pcs = {}; // uid -> RTCPeerConnection
  let signalUnsub = null;
  const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

  function signalsRef(liveId, uid) {
    return fbDb.collection('lives').doc(liveId).collection('signals').doc(uid);
  }

  function stopAllPeers() {
    Object.keys(pcs).forEach(uid => {
      try { pcs[uid].close(); } catch (e) {}
      delete pcs[uid];
    });
    if (signalUnsub) { signalUnsub(); signalUnsub = null; }
  }

  function wireIce(pc, channelUid) {
    pc.onicecandidate = (ev) => {
      if (!ev.candidate || !state.liveId) return;
      fbDb.collection('lives').doc(state.liveId).collection('signals').doc(channelUid)
        .collection('ice').add({
          from: state.user.uid,
          candidate: ev.candidate.toJSON(),
          t: Date.now()
        }).catch(() => {});
    };
  }

  async function ensureHostPeer(viewerUid) {
    if (!state.isHost || !state.stream) return;
    // Reuse only if still healthy
    if (pcs[viewerUid]) {
      const st = pcs[viewerUid].connectionState;
      if (st === 'connected' || st === 'connecting' || st === 'new') return;
      try {
        if (pcs[viewerUid]._unsub) pcs[viewerUid]._unsub();
        if (pcs[viewerUid]._iceUnsub) pcs[viewerUid]._iceUnsub();
        pcs[viewerUid].close();
      } catch (e) {}
      delete pcs[viewerUid];
    }
    try {
      // Fresh signal doc for this viewer
      try { await signalsRef(state.liveId, viewerUid).delete(); } catch (e) {}
      const pc = new RTCPeerConnection(iceServers);
      pcs[viewerUid] = pc;
      state.stream.getTracks().forEach(track => {
        try { pc.addTrack(track, state.stream); } catch (e) {}
      });
      wireIce(pc, viewerUid);
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'failed' || pc.connectionState === 'closed' || pc.connectionState === 'disconnected') {
          try {
            if (pc._unsub) pc._unsub();
            if (pc._iceUnsub) pc._iceUnsub();
            pc.close();
          } catch (e) {}
          delete pcs[viewerUid];
        }
      };
      const offer = await pc.createOffer({ offerToReceiveAudio: false, offerToReceiveVideo: false });
      await pc.setLocalDescription(offer);
      await signalsRef(state.liveId, viewerUid).set({
        type: 'offer',
        from: state.user.uid,
        to: viewerUid,
        sdp: offer.sdp,
        t: Date.now()
      });
      // Listen for answer + ICE from this viewer
      if (!pc._unsub) {
        pc._unsub = signalsRef(state.liveId, viewerUid).onSnapshot(async doc => {
          if (!doc.exists) return;
          const d = doc.data();
          if (d.type === 'answer' && d.sdp && pc.signalingState !== 'stable') {
            try {
              await pc.setRemoteDescription({ type: 'answer', sdp: d.sdp });
            } catch (e) {}
          }
        });
        pc._iceUnsub = signalsRef(state.liveId, viewerUid).collection('ice')
          .onSnapshot(snap => {
            snap.docChanges().forEach(async ch => {
              if (ch.type !== 'added') return;
              const d = ch.doc.data();
              if (d.from === viewerUid && d.candidate) {
                try { await pc.addIceCandidate(d.candidate); } catch (e) {}
              }
            });
          });
      }
    } catch (e) {
      console.warn('host peer', e);
    }
  }

  async function startViewerWebRTC(liveId) {
    if (state.isHost || !state.user) return;
    stopAllPeers();
    try {
      const liveDoc = await fbDb.collection('lives').doc(liveId).get();
      const host = liveDoc.exists ? liveDoc.data().hostUid : null;
      if (!host) return;

      // Clear stale signal so host sends a new offer
      try { await signalsRef(liveId, state.user.uid).delete(); } catch (e) {}

      const pc = new RTCPeerConnection(iceServers);
      pcs['host'] = pc;
      wireIce(pc, state.user.uid); // ICE channel is viewer uid (same as host writes to)

      pc.ontrack = (ev) => {
        const video = document.getElementById('cam');
        const fallback = document.querySelector('.cam-fallback');
        if (video) {
          const stream = ev.streams[0] || new MediaStream([ev.track]);
          video.srcObject = stream;
          video.setAttribute('playsinline', '');
          video.muted = false;
          video.volume = 1;
          video.style.transform = 'none';
          const play = () => video.play().catch(() => {});
          play();
          window._unlockLiveSound = () => {
            video.muted = false;
            video.volume = 1;
            play();
            const hint = document.getElementById('soundHint');
            if (hint) hint.style.display = 'none';
          };
          document.body.addEventListener('touchstart', window._unlockLiveSound, { once: true });
          document.body.addEventListener('click', window._unlockLiveSound, { once: true });
        }
        if (fallback) fallback.style.display = 'none';
        state.demo = false;
        const hint = document.getElementById('soundHint');
        if (hint) hint.style.display = 'block';
      };

      signalUnsub = signalsRef(liveId, state.user.uid).onSnapshot(async doc => {
        if (!doc.exists) return;
        const d = doc.data();
        if (d.type === 'offer' && d.sdp) {
          try {
            if (!pc.currentRemoteDescription) {
              await pc.setRemoteDescription({ type: 'offer', sdp: d.sdp });
              const answer = await pc.createAnswer();
              await pc.setLocalDescription(answer);
              await signalsRef(liveId, state.user.uid).set({
                type: 'answer',
                from: state.user.uid,
                to: host,
                sdp: answer.sdp,
                t: Date.now()
              }, { merge: true });
            }
          } catch (e) { console.warn('answer', e); }
        }
      });
      signalsRef(liveId, state.user.uid).collection('ice').onSnapshot(snap => {
        snap.docChanges().forEach(async ch => {
          if (ch.type !== 'added') return;
          const d = ch.doc.data();
          if (d.from === host && d.candidate) {
            try { await pc.addIceCandidate(d.candidate); } catch (e) {}
          }
        });
      });
    } catch (e) {
      console.warn('viewer webrtc', e);
    }
  }

  function startViewerGrowth() {
    stopViewerGrowth();
    if (!(state.isHost && state.isOwnerStream)) {
      state.botViewers = 0;
      state.viewers = state.realViewers;
      updateViewerLabel();
      return;
    }
    state.botViewers = 0;
    state.viewers = state.realViewers; // starts at 0 if alone
    updateViewerLabel();
    // Push 0 to list so others see 0 watching
    if (state.liveId) {
      fbDb.collection('lives').doc(state.liveId).update({
        viewerCount: state.viewers,
        realViewerCount: state.realViewers
      }).catch(() => {});
    }

    viewerTimer = setInterval(() => {
      if (!(state.isHost && state.isOwnerStream) || state.screen === 'home') return;
      const v = state.botViewers;
      let add = 0;
      // Very slow ramp from 0 so chat stays quiet at the start
      if (v < 3) add = Math.random() < 0.35 ? 1 : 0;
      else if (v < 10) add = Math.random() < 0.4 ? 1 : 0;
      else if (v < 25) add = Math.random() < 0.5 ? (1 + Math.floor(Math.random() * 2)) : 0;
      else if (v < 80) add = 1 + Math.floor(Math.random() * 2);
      else if (v < 300) add = 1 + Math.floor(Math.random() * 4);
      else if (v < 1200) add = 3 + Math.floor(Math.random() * 10);
      else if (v < 5000) add = 10 + Math.floor(Math.random() * 35);
      else if (v < 15000) add = 25 + Math.floor(Math.random() * 80);
      else add = 40 + Math.floor(Math.random() * 150);
      if (v > 100 && Math.random() < 0.12) add = -Math.floor(1 + Math.random() * Math.min(20, v * 0.02));

      state.botViewers = Math.max(0, state.botViewers + add);
      state.viewers = state.realViewers + state.botViewers;
      updateViewerLabel();
      if (state.liveId && Math.random() < 0.35) {
        fbDb.collection('lives').doc(state.liveId).update({
          viewerCount: state.viewers,
          realViewerCount: state.realViewers
        }).catch(() => {});
      }
    }, 1600);
  }
  function stopViewerGrowth() {
    if (viewerTimer) { clearInterval(viewerTimer); viewerTimer = null; }
  }
  function updateViewerLabel() {
    const el = document.getElementById('viewerCount');
    if (el) el.textContent = formatViewers(state.viewers);
  }

  function subscribeChat(liveId) {
    if (chatUnsub) chatUnsub();
    chatUnsub = fbDb.collection('lives').doc(liveId).collection('messages')
      .orderBy('createdAt', 'desc').limit(60)
      .onSnapshot(snap => {
        const rows = [];
        snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
        rows.reverse();

        // Build remote list — host already paints bots locally, so skip remote bots on host (stops doubles)
        const remote = [];
        rows.forEach(r => {
          if (state.isHost && r.bot) return;
          remote.push({
            id: r.id,
            user: r.name || 'user',
            color: r.color || randColor(),
            text: r.text || '',
            local: false,
            bot: !!r.bot
          });
        });

        // Keep only local bots on host; drop local user msgs that already arrived from server
        const remoteKeys = new Set(remote.map(r => (r.user + '|' + r.text).toLowerCase()));
        const locals = chatLines.filter(c => {
          if (!c.local) return false;
          if (c.bot) return true; // host bot lines
          // user optimistic line already on server → drop
          if (remoteKeys.has((c.user + '|' + c.text).toLowerCase())) return false;
          return true;
        });

        chatLines.length = 0;
        remote.forEach(r => chatLines.push(r));
        locals.slice(-20).forEach(l => chatLines.push(l));
        // Final dedupe consecutive identical lines
        for (let i = chatLines.length - 1; i > 0; i--) {
          const a = chatLines[i], b = chatLines[i - 1];
          if (a.user === b.user && a.text === b.text) chatLines.splice(i, 1);
        }
        while (chatLines.length > 90) chatLines.shift();
        schedulePaintChat();
      }, err => console.warn('chat', err));
  }

  let botWriteQueue = [];
  let botWriteTimer = null;
  function flushBotWrites() {
    botWriteTimer = null;
    if (!state.liveId || !state.isHost) { botWriteQueue = []; return; }
    const batch = botWriteQueue.splice(0, 4);
    batch.forEach(m => {
      fbDb.collection('lives').doc(state.liveId).collection('messages').add({
        uid: 'bot',
        name: m.user,
        text: m.text,
        color: m.color,
        bot: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(() => {});
    });
    if (botWriteQueue.length) botWriteTimer = setTimeout(flushBotWrites, 350);
  }
  function pushLocalChat(user, text, color, opts) {
    const o = opts || {};
    const col = color || randColor();
    // Skip exact consecutive duplicate
    const last = chatLines[chatLines.length - 1];
    if (last && last.user === user && last.text === text) return;
    chatLines.push({
      id: 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      user, color: col, text, local: true, bot: !!o.bot
    });
    while (chatLines.length > 90) chatLines.shift();
    schedulePaintChat();
    // Sync host bot chat to Firebase so other phones see comments
    if (o.bot && state.isHost && state.isOwnerStream && state.liveId) {
      botWriteQueue.push({ user, text, color: col });
      if (!botWriteTimer) botWriteTimer = setTimeout(flushBotWrites, 300);
    }
  }
  function schedulePaintChat() {
    if (paintScheduled) return;
    paintScheduled = true;
    requestAnimationFrame(() => {
      paintScheduled = false;
      paintChat();
    });
  }
  function paintChat() {
    const list = document.getElementById('chatList');
    if (!list) return;
    const slice = chatLines.slice(-45);
    const lastId = slice.length ? slice[slice.length - 1].id : null;
    // Full rebuild only when needed; still cheaper with rAF batching
    const html = slice.map((c, i) => {
      const isNew = i >= slice.length - 3;
      return `<div class="chat-line${isNew ? ' new' : ''}"><span class="chat-user" style="color:${c.color}">${escapeHtml(c.user)}</span><span class="chat-text">${escapeHtml(c.text)}</span></div>`;
    }).join('');
    if (list.dataset.lastId === lastId && list.childElementCount === slice.length) return;
    list.dataset.lastId = lastId || '';
    list.innerHTML = html;
    list.scrollTop = list.scrollHeight;
  }

  function burstGreetings() {
    // Only after first viewer growth tick has some people — wait a bit
    setTimeout(() => {
      if (!(state.isHost && state.isOwnerStream)) return;
      if ((state.botViewers + state.realViewers) < 1) return;
      const total = 3 + Math.floor(Math.random() * 4);
      for (let i = 0; i < total; i++) {
        setTimeout(() => {
          if (!(state.isHost && state.isOwnerStream)) return;
          if ((state.botViewers + state.realViewers) < 1) return;
          pushLocalChat(randName(), GREET_POOL[Math.floor(Math.random() * GREET_POOL.length)], randColor(), { bot: true });
        }, i * (500 + Math.random() * 500));
      }
    }, 2500);
  }

  async function sendUserChat() {
    const input = document.getElementById('chatInput');
    if (!input || !state.user || !state.liveId) return;
    const text = (input.value || '').trim();
    if (!text) return;
    input.value = '';
    // Optimistic show once — server echo is deduped in subscribeChat
    pushLocalChat(state.user.name, text, '#fff', { bot: false });
    try {
      await fbDb.collection('lives').doc(state.liveId).collection('messages').add({
        uid: state.user.uid,
        name: state.user.name,
        text: text,
        color: '#ffffff',
        bot: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } catch (e) {}
  }

  function startBotChatEngine() {
    stopBotChatEngine();
    if (!(state.isHost && state.isOwnerStream)) return;
    // Scales with displayed viewers:
    // 0 → silence | 1 → one slow typer | 2 → a bit more | 10 → faster | high → busy
    chatTimer = setInterval(() => {
      if (!(state.isHost && state.isOwnerStream)) return;
      const v = Math.floor(state.viewers || (state.botViewers + state.realViewers));
      if (v <= 0) return;

      let n = 0;
      if (v === 1) n = Math.random() < 0.28 ? 1 : 0;       // ~1 msg / 6–7s
      else if (v === 2) n = Math.random() < 0.4 ? 1 : 0;  // ~1 / 4–5s
      else if (v <= 4) n = Math.random() < 0.5 ? 1 : 0;
      else if (v <= 8) n = Math.random() < 0.65 ? 1 : 0;
      else if (v <= 15) n = Math.random() < 0.8 ? 1 : 0;
      else if (v <= 40) n = 1 + (Math.random() < 0.35 ? 1 : 0);
      else if (v <= 100) n = 1 + Math.floor(Math.random() * 2);
      else if (v <= 500) n = 2 + Math.floor(Math.random() * 2);
      else if (v <= 2000) n = 2 + Math.floor(Math.random() * 3);
      else n = 3 + Math.floor(Math.random() * 4);

      if (Date.now() < state.chatBurstUntil) n += 1 + Math.floor(Math.random() * 2);

      for (let i = 0; i < n; i++) {
        setTimeout(() => {
          if (!(state.isHost && state.isOwnerStream)) return;
          if ((state.viewers || 0) <= 0) return;
          // Low viewers: more hi/hello energy
          const early = (state.viewers || 0) < 12 && Math.random() < 0.5;
          const text = early
            ? GREET_POOL[Math.floor(Math.random() * GREET_POOL.length)]
            : randChat();
          pushLocalChat(randName(), text, randColor(), { bot: true });
        }, Math.random() * 500);
      }
    }, 1800);
  }
  function stopBotChatEngine() {
    if (chatTimer) { clearInterval(chatTimer); chatTimer = null; }
  }

  function spawnFloat(emoji) {
    const root = document.getElementById('floats');
    if (!root) return;
    const el = document.createElement('div');
    el.className = 'float-emoji';
    el.textContent = emoji;
    el.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
    root.appendChild(el);
    setTimeout(() => el.remove(), 2300);
  }
  function spamReaction(packKey, intensity) {
    if (!(state.isHost && state.isOwnerStream)) return;
    const pack = SPAM_PACKS[packKey] || SPAM_PACKS.w;
    const count = Math.floor(18 + intensity * 55);
    state.chatBurstUntil = Date.now() + 1400;
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const msg = pack[Math.floor(Math.random() * pack.length)];
        pushLocalChat(randName(), msg, randColor(), { bot: true });
        if (/[🔥❤️💕😂😭💀👏]/.test(msg) || Math.random() < 0.2) {
          spawnFloat(msg.match(/[🔥❤️💕😂😭💀👏🙌👀✨💯🚀👑]/)?.[0] || '❤️');
        }
      }, Math.random() * 1100);
    }
    state.botViewers += Math.floor(30 + intensity * 200);
    state.viewers = state.realViewers + state.botViewers;
    updateViewerLabel();
  }

  function startListening() {
    if (!(state.isHost && state.isOwnerStream)) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const mic = document.getElementById('micStatus');
    if (!SR) { if (mic) mic.textContent = 'Mic: not supported'; return; }
    try {
      if (recognition) { try { recognition.stop(); } catch (e) {} }
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      recognition.onstart = () => { if (mic) { mic.textContent = 'Mic: listening…'; mic.className = 'mic-status on'; } };
      recognition.onend = () => {
        if (state.screen === 'live' && state.isHost) {
          setTimeout(() => { try { recognition.start(); } catch (e) {} }, 400);
        }
      };
      recognition.onresult = (ev) => {
        let finalText = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript;
        }
        if (finalText) handleVoice(finalText.trim());
      };
      recognition.start();
    } catch (e) { if (mic) mic.textContent = 'Mic: blocked'; }
  }
  function stopListening() {
    if (recognition) {
      try { recognition.onend = null; recognition.stop(); } catch (e) {}
      recognition = null;
    }
  }
  let lastTriggerAt = 0;
  function handleVoice(text) {
    const now = Date.now();
    if (now - lastTriggerAt < 1800) return;
    for (const tr of VOICE_TRIGGERS) {
      if (tr.re.test(text)) {
        lastTriggerAt = now;
        spamReaction(tr.pack, tr.intensity);
        return;
      }
    }
  }

  async function startCamera(facing) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
    const mode = facing || state.facingMode || 'user';
    state.facingMode = mode;
    try {
      stopCamera();
      // Host captures mic too so mute works + future viewers can hear
      const wantAudio = !!state.isHost;
      const audioOpts = wantAudio ? {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      } : false;
      try {
        state.stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: mode }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: audioOpts
        });
      } catch (e) {
        state.stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: mode },
          audio: audioOpts
        });
      }
      // Ensure mic track is live (not muted by OS)
      if (state.stream) {
        state.stream.getAudioTracks().forEach(t => {
          t.enabled = !state.muted;
        });
      }
      applyMuteState();
      return true;
    } catch (e) {
      try {
        state.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: !!state.isHost });
        applyMuteState();
        return true;
      } catch (e2) { return false; }
    }
  }
  function stopCamera() {
    if (state.stream) {
      state.stream.getTracks().forEach(t => t.stop());
      state.stream = null;
    }
  }
  function applyMuteState() {
    if (!state.stream) return;
    state.stream.getAudioTracks().forEach(t => {
      t.enabled = !state.muted;
    });
    // Keep WebRTC senders in sync
    Object.values(pcs).forEach(pc => {
      try {
        pc.getSenders().forEach(sender => {
          if (sender.track && sender.track.kind === 'audio') {
            sender.track.enabled = !state.muted;
          }
        });
      } catch (e) {}
    });
  }
  function toggleMute() {
    state.muted = !state.muted;
    applyMuteState();
    const btn = document.getElementById('muteBtn');
    if (btn) btn.textContent = state.muted ? '🔇' : '🎤';
  }
  function attachCam() {
    const video = document.getElementById('cam');
    if (video && state.stream) {
      video.srcObject = state.stream;
      video.muted = true; // host preview: no echo
      video.style.transform = state.facingMode === 'user' ? 'scaleX(-1)' : 'none';
      video.play().catch(() => {});
    }
  }
  async function flipCamera() {
    if (!state.isHost) return;
    const next = state.facingMode === 'user' ? 'environment' : 'user';
    // Get NEW camera without stopping old tracks first (avoids freeze for viewers)
    let newStream = null;
    try {
      try {
        newStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: next }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false // keep existing mic track
        });
      } catch (e) {
        newStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: next },
          audio: false
        });
      }
    } catch (e) {
      // Fallback: full restart
      const ok = await startCamera(next);
      if (ok) {
        state.demo = false;
        attachCam();
        // Reconnect peers with new tracks
        Object.keys(pcs).forEach(uid => {
          if (uid === 'host') return;
          try { pcs[uid].close(); } catch (e2) {}
          delete pcs[uid];
          ensureHostPeer(uid);
        });
      }
      return;
    }

    const newVideo = newStream.getVideoTracks()[0];
    if (!newVideo) return;

    // Replace video on every peer so viewers don't freeze
    const replacements = [];
    Object.keys(pcs).forEach(uid => {
      if (uid === 'host') return;
      const pc = pcs[uid];
      if (!pc) return;
      pc.getSenders().forEach(sender => {
        if (sender.track && sender.track.kind === 'video') {
          replacements.push(sender.replaceTrack(newVideo).catch(() => {}));
        }
      });
    });
    await Promise.all(replacements);

    // Swap local stream video track; keep audio from old stream
    const oldStream = state.stream;
    const oldAudio = oldStream ? oldStream.getAudioTracks() : [];
    const combined = new MediaStream([newVideo, ...oldAudio]);
    state.stream = combined;
    state.facingMode = next;
    state.demo = false;
    attachCam();

    // Stop only the old VIDEO track
    if (oldStream) {
      oldStream.getVideoTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    }
  }

  async function addBotToCurrentLive() {
    if (!state.user || !state.user.isOwner || !state.liveId) return;
    const botId = 'bot_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const botName = randName();
    const color = randColor();
    try {
      // Appear as a watcher in this live (host or someone else's)
      await fbDb.collection('lives').doc(state.liveId).collection('viewers').doc(botId).set({
        name: botName,
        isBot: true,
        joinedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      // Chat line
      await fbDb.collection('lives').doc(state.liveId).collection('messages').add({
        uid: botId,
        name: botName,
        text: Math.random() < 0.55
          ? GREET_POOL[Math.floor(Math.random() * GREET_POOL.length)]
          : randChat(),
        color: color,
        bot: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      // If we are host of our owner stream, also bump local bot count feel
      if (state.isHost && state.isOwnerStream) {
        state.botViewers = (state.botViewers || 0) + 1;
        state.viewers = state.realViewers + state.botViewers;
        updateViewerLabel();
        fbDb.collection('lives').doc(state.liveId).update({
          viewerCount: state.viewers,
          realViewerCount: state.realViewers
        }).catch(() => {});
      }
    } catch (e) {
      console.warn('add bot', e);
    }
  }

  function render() {
    const app = document.getElementById('app');
    if (state.screen === 'home') {
      const lives = state.lives || [];
      const listHtml = lives.length === 0
        ? `<div class="empty">No one is live right now.<br/>Be the first — hit Go Live.</div>`
        : lives.map(l => {
            const vc = formatViewers(l.viewerCount || 0);
            const mine = state.user && l.hostUid === state.user.uid;
            return `<div class="live-card">
              <div class="live-card-info">
                <div class="live-card-title">${escapeHtml(l.title || 'Live')}</div>
                <div class="live-card-meta"><span class="live-dot-sm"></span>${escapeHtml(l.hostName || 'Host')} · ${vc} watching${mine ? ' · you' : ''}</div>
              </div>
              <button class="join-btn" data-id="${l.id}">${mine ? 'Open' : 'Join'}</button>
            </div>`;
          }).join('');

      app.innerHTML = `
        <div class="home">
          <div class="home-head">
            <div class="logo">Broadcast</div>
            <div class="home-title">GO <span>LIVE</span></div>
            <div class="user-row">${
              state.user
                ? `Signed in as <strong>${escapeHtml(state.user.name)}</strong>`
                : 'Sign in to go live or join'
            }</div>
          </div>
          <div class="lives-label">Live now</div>
          <div class="lives-list">${listHtml}</div>
          ${state.error ? `<p class="err">${escapeHtml(state.error)}</p>` : ''}
          <div class="bottom-bar">
            <button class="go-live" id="goLiveBtn">${state.user ? '● Go Live' : 'Sign in to Go Live'}</button>
            ${state.user
              ? `<button class="ghost-btn" id="signOutBtn">Sign out</button>`
              : `<button class="ghost-btn" id="signInBtn">Sign in with Google</button>`}
          </div>
        </div>
        ${state.showNameModal ? `
          <div class="modal-overlay" id="modalBg">
            <div class="modal-card" onclick="event.stopPropagation()">
              <h2>Name your live</h2>
              <p>This title shows up on the lives list for everyone.</p>
              <input class="input" id="titleInput" maxlength="48" value="${escapeHtml(state.streamTitle)}" placeholder="My Live" />
              <button class="go-live" id="confirmLive">Start Live</button>
              <button class="ghost-btn" id="cancelLive" style="margin-top:8px;">Cancel</button>
            </div>
          </div>` : ''}`;

      document.getElementById('goLiveBtn').onclick = () => {
        if (!state.user) signIn();
        else openNameModal();
      };
      const so = document.getElementById('signOutBtn');
      if (so) so.onclick = signOut;
      const si = document.getElementById('signInBtn');
      if (si) si.onclick = signIn;
      document.querySelectorAll('.join-btn').forEach(btn => {
        btn.onclick = () => joinLive(btn.getAttribute('data-id'));
      });
      if (state.showNameModal) {
        document.getElementById('modalBg').onclick = () => { state.showNameModal = false; render(); };
        document.getElementById('cancelLive').onclick = () => { state.showNameModal = false; render(); };
        document.getElementById('confirmLive').onclick = () => {
          state.streamTitle = document.getElementById('titleInput').value;
          confirmGoLive();
        };
      }
      return;
    }

    const isWatch = state.screen === 'watch';
    app.innerHTML = `
      <div class="stage">
        <div class="video-wrap">
          <video id="cam" playsinline autoplay muted></video>
          ${(state.demo || isWatch) ? `<div class="cam-fallback">${
            isWatch
              ? `<div><strong>${escapeHtml(state.hostName)}</strong> is live</div><div style="opacity:.7;margin-top:8px;max-width:260px">Connecting video… Tap screen if you see picture but no sound.</div>`
              : `<div>No camera — demo mode</div><div style="opacity:.7;margin-top:8px">Chat & viewers still work</div>`
          }</div>` : ''}
          <button id="soundHint" style="display:none;position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:25;border:none;border-radius:999px;padding:10px 16px;background:rgba(0,0,0,.7);color:#fff;font-weight:700;font-size:13px;">Tap for sound 🔊</button>
          <div class="topbar">
            <div class="live-pill">
              <div class="live-dot"></div>
              <div class="live-label">LIVE</div>
              <div class="stream-title">${escapeHtml(state.title)}</div>
              <div class="viewers"><span id="viewerCount">${formatViewers(state.viewers)}</span> watching</div>
            </div>
            <div class="top-actions">
              ${state.user && state.user.isOwner ? `<button class="b-btn" id="bBtn" title="Add 1 bot">b</button>` : ''}
              ${state.isHost ? `<button class="flip-btn" id="muteBtn" title="Mute mic">${state.muted ? '🔇' : '🎤'}</button>` : ''}
              ${state.isHost ? `<button class="flip-btn" id="flipBtn" title="Flip camera">⟲</button>` : ''}
              <button class="end-btn" id="endBtn">×</button>
            </div>
          </div>
          <div class="floats" id="floats"></div>
        </div>
        <div class="chat-wrap">
          ${state.isHost && state.isOwnerStream ? `<div class="mic-status" id="micStatus">Mic: starting…</div>` : ''}
          <div class="chat-list" id="chatList"></div>
          <div class="chat-input-row">
            <input class="chat-input" id="chatInput" placeholder="Say something…" maxlength="120" />
            <button class="chat-send" id="chatSend">Send</button>
          </div>
        </div>
      </div>`;

    document.getElementById('endBtn').onclick = () => leaveCurrentLive(true);
    const bBtn = document.getElementById('bBtn');
    if (bBtn) bBtn.onclick = addBotToCurrentLive;
    const flip = document.getElementById('flipBtn');
    if (flip) flip.onclick = flipCamera;
    const mute = document.getElementById('muteBtn');
    if (mute) mute.onclick = toggleMute;
    const soundHint = document.getElementById('soundHint');
    if (soundHint) {
      soundHint.onclick = () => {
        const video = document.getElementById('cam');
        if (video) {
          video.muted = false;
          video.volume = 1;
          video.play().catch(() => {});
        }
        soundHint.style.display = 'none';
      };
    }
    document.getElementById('chatSend').onclick = sendUserChat;
    document.getElementById('chatInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendUserChat();
    });
    attachCam();
    paintChat();
    updateViewerLabel();
  }

  if (fbReady) subscribeLives();
  render();
})();
</script>
</body>
</html>
