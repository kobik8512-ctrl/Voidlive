<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruthless Chess Trap & Mate Engine — Stockfish Powered</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .sq-light { background-color: #d8b48a; }
        .sq-dark  { background-color: #3f281d; }
        .sq-selected {
            box-shadow: inset 0 0 0 4px #3b82f6;
            background-color: rgba(59, 130, 246, 0.45) !important;
        }
        .sq-last-move { background-color: rgba(234, 179, 8, 0.35) !important; }
        .sq-best-from {
            box-shadow: inset 0 0 0 4px #10b981;
            background-color: rgba(16, 185, 129, 0.38) !important;
        }
        .sq-best-to {
            box-shadow: inset 0 0 0 4px #10b981;
            background-color: rgba(16, 185, 129, 0.58) !important;
            animation: pulseGreen 1.4s infinite;
        }
        .sq-killer-to {
            box-shadow: inset 0 0 0 4px #f43f5e;
            background-color: rgba(244, 63, 94, 0.55) !important;
            animation: pulseRed 1.1s infinite;
        }
        @keyframes pulseGreen {
            0%, 100% { box-shadow: inset 0 0 0 4px #10b981; }
            50% { box-shadow: inset 0 0 0 6px #34d399; }
        }
        @keyframes pulseRed {
            0%, 100% { box-shadow: inset 0 0 0 4px #f43f5e; }
            50% { box-shadow: inset 0 0 0 7px #fb7185; }
        }
        .legal-dot {
            width: 28%; height: 28%; border-radius: 9999px;
            background-color: rgba(15, 23, 42, 0.42); pointer-events: none;
        }
        .legal-capture {
            width: 82%; height: 82%; border-radius: 9999px;
            border: 4px solid rgba(225, 29, 72, 0.65); pointer-events: none;
        }
        #eval-fill { transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
        .chess-piece {
            width: 84%; height: 84%;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.6));
            transition: transform 0.1s ease; user-select: none; pointer-events: none;
        }
        .square:active .chess-piece { transform: scale(1.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5 max-w-lg mx-auto">

    <!-- Top Header & Controls -->
    <header class="w-full flex flex-col gap-2">
        <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400 font-black text-lg">⚔</div>
                <div>
                    <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-slate-100 leading-none">Trap & Mate Engine</h1>
                    <p class="text-[10px] text-rose-400 font-semibold mt-0.5 uppercase tracking-wider">Stockfish 19 + Ruthless Mode</p>
                </div>
            </div>

            <!-- Side Selector -->
            <div class="flex items-center bg-slate-800/90 p-1 rounded-xl border border-slate-700">
                <button id="side-w-btn" onclick="setMySide('w')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-400">
                    <span class="w-2.5 h-2.5 rounded-full bg-white border border-slate-400 inline-block"></span> White
                </button>
                <button id="side-b-btn" onclick="setMySide('b')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-emerald-600 text-white shadow">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#3f281d] border border-amber-200 inline-block"></span> Brown
                </button>
            </div>
        </div>

        <!-- Strength / Think Time -->
        <div class="w-full flex items-center gap-2 bg-slate-800/90 p-2 rounded-xl border border-slate-700/70">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider shrink-0">Think</span>
            <select id="think-time" class="flex-1 bg-slate-900 border border-slate-600 rounded-lg text-xs font-semibold px-2 py-1.5 text-emerald-300 outline-none">
                <option value="400">Fast (0.4s) — still strong</option>
                <option value="1000" selected>Strong (1s) — beats most bots</option>
                <option value="2000">Very Strong (2s)</option>
                <option value="4000">Monster (4s) — near max strength</option>
            </select>
            <span id="engine-status" class="text-[10px] font-bold text-amber-400 shrink-0">Loading SF…</span>
        </div>

        <!-- Evaluation Bar -->
        <div class="w-full bg-slate-800/90 p-2 rounded-xl border border-slate-700/70 shadow-inner">
            <div class="flex justify-between items-center text-[11px] font-semibold mb-1 px-0.5">
                <span class="text-slate-200 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-white inline-block"></span> White
                </span>
                <span id="eval-score" class="font-mono text-emerald-400 font-bold">0.0 (Even)</span>
                <span class="text-amber-200/90 flex items-center gap-1">
                    Brown <span class="w-2 h-2 rounded-full bg-[#6b442a] border border-amber-300/50 inline-block"></span>
                </span>
            </div>
            <div class="w-full h-2.5 bg-[#4a2e1b] rounded-full overflow-hidden flex border border-slate-700">
                <div id="eval-fill" class="h-full bg-slate-100" style="width: 50%;"></div>
            </div>
        </div>

        <!-- Best Move Banner -->
        <div id="suggestion-card" class="w-full bg-gradient-to-r from-emerald-950/90 to-slate-800/95 border border-emerald-500/40 rounded-xl p-3 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-2.5 min-w-0">
                <div id="turn-badge" class="px-2.5 py-1.5 rounded-lg bg-slate-900/90 border border-slate-700 text-[11px] font-extrabold uppercase tracking-wider text-slate-200 shrink-0">
                    White's Turn
                </div>
                <div class="truncate">
                    <div class="text-[10px] uppercase tracking-wider text-emerald-400 font-bold flex items-center gap-1.5">
                        <span id="move-role-label">Best Move</span>
                        <span id="thinking-spinner" class="hidden w-2.5 h-2.5 border-2 border-emerald-400 border-t-transparent rounded-full animate-spin"></span>
                    </div>
                    <div id="best-move-text" class="text-base sm:text-lg font-black text-white tracking-tight truncate">
                        Loading Stockfish…
                    </div>
                    <div id="tactic-tag" class="text-[11px] font-semibold text-amber-300 truncate">
                        Preparing engine…
                    </div>
                </div>
            </div>
            <button id="btn-apply-best" onclick="applySuggestedMove()" class="bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-extrabold text-xs px-3.5 py-2.5 rounded-xl shadow transition shrink-0 ml-2">
                Play Move
            </button>
        </div>
    </header>

    <!-- Board -->
    <main class="w-full my-2 flex flex-col items-center">
        <div class="w-full aspect-square max-w-[440px] bg-[#2a1a12] p-2 sm:p-2.5 rounded-2xl shadow-2xl border-2 border-[#5c3a28] relative">
            <div id="board-grid" class="w-full h-full grid grid-cols-8 grid-rows-8 rounded-lg overflow-hidden border border-[#24150e]"></div>
        </div>
    </main>

    <!-- Bottom Controls -->
    <footer class="w-full flex flex-col gap-2">
        <div class="grid grid-cols-4 gap-2">
            <button onclick="undoMove()" id="btn-undo" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 active:scale-95 border border-slate-700 py-2.5 px-2 rounded-xl text-xs font-semibold flex flex-col items-center justify-center gap-0.5 transition">
                <span class="text-sm">↩</span><span>Undo</span>
            </button>
            <button onclick="redoMove()" id="btn-redo" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 active:scale-95 border border-slate-700 py-2.5 px-2 rounded-xl text-xs font-semibold flex flex-col items-center justify-center gap-0.5 transition">
                <span class="text-sm">↪</span><span>Redo</span>
            </button>
            <button onclick="toggleEditMode()" id="btn-edit" class="bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 py-2.5 px-2 rounded-xl text-xs font-semibold flex flex-col items-center justify-center gap-0.5 transition">
                <span class="text-sm">✎</span><span id="edit-btn-label">Edit Board</span>
            </button>
            <button onclick="resetBoard()" class="bg-rose-950/60 hover:bg-rose-900/70 active:scale-95 border border-rose-800/50 text-rose-200 py-2.5 px-2 rounded-xl text-xs font-semibold flex flex-col items-center justify-center gap-0.5 transition">
                <span class="text-sm">↺</span><span>Reset</span>
            </button>
        </div>

        <!-- Editor Panel -->
        <div id="editor-panel" class="hidden w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 flex flex-col gap-2">
            <div class="flex items-center justify-between text-xs">
                <span class="font-semibold text-amber-300">Setup Mode: Tap a piece below, then tap squares</span>
                <button onclick="clearBoard()" class="text-rose-400 hover:underline font-semibold">Clear All</button>
            </div>
            <div class="grid grid-cols-7 gap-1.5" id="piece-palette"></div>
            <div class="flex items-center justify-between pt-1 border-t border-slate-700/80 text-xs">
                <div class="flex items-center gap-2">
                    <span class="text-slate-400">Next turn:</span>
                    <button onclick="setEditorTurn('w')" id="turn-w-btn" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-semibold">White</button>
                    <button onclick="setEditorTurn('b')" id="turn-b-btn" class="px-2.5 py-1 rounded-lg bg-slate-700 text-slate-300 font-semibold">Brown</button>
                </div>
                <button onclick="toggleEditMode()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-lg">Done</button>
            </div>
        </div>
    </footer>

    <!-- Promotion Modal -->
    <div id="promo-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 max-w-xs w-full shadow-2xl text-center">
            <h3 class="text-sm font-bold text-white mb-3">Promote Pawn To:</h3>
            <div class="grid grid-cols-4 gap-2" id="promo-choices"></div>
        </div>
    </div>

let pendingPromotionMove = null;

let stockfishReady = false;
let stockfishSearching = false;
let currentSearchId = 0;
let searchTimeoutId = null;

// ==========================================
// 4. STOCKFISH ENGINE WRAPPER (robust)
// ==========================================
function setEngineStatus(text, colorClass) {
    const el = document.getElementById('engine-status');
    if (!el) return;
    el.textContent = text;
    el.className = 'text-[10px] font-bold shrink-0 ' + (colorClass || 'text-amber-400');
}

function initStockfish() {
    setEngineStatus('Loading SF…', 'text-amber-400');

    // Prefer local files (same folder as the HTML). CDN is second choice.
    const candidates = [
        'stockfish-19-lite-single.js',
        'https://unpkg.com/stockfish@19.0.1/bin/stockfish-19-lite-single.js'
    ];

    let tryIndex = 0;
    let loadTimeout = null;

    function failToFallback(reason) {
        console.warn('Stockfish unavailable:', reason);
        stockfishReady = false;
        engineMode = 'fallback';
        setEngineStatus('Fast mode', 'text-amber-400');
        if (stockfish) {
            try { stockfish.terminate(); } catch (_) {}
            stockfish = null;
        }
        // Kick a calculation so the user is not left hanging
        setTimeout(() => triggerEngineCalculation(), 50);
    }

    function tryNext() {
        if (tryIndex >= candidates.length) {
            failToFallback('all sources failed');
            return;
        }

        const url = candidates[tryIndex++];
        console.log('Trying Stockfish from', url);

        // Safety: if this candidate never answers, move on after 4 s
        clearTimeout(loadTimeout);
        loadTimeout = setTimeout(() => {
            console.warn('Timeout loading', url);
            try { if (stockfish) stockfish.terminate(); } catch (_) {}
            stockfish = null;
            tryNext();
        }, 4000);

        try {
            stockfish = new Worker(url);

            stockfish.onmessage = function (e) {
                const line = e.data;
                if (typeof line !== 'string') return;

                if (line === 'uciok') {
                    stockfish.postMessage('isready');
                }

                if (line === 'readyok') {
                    clearTimeout(loadTimeout);
                    stockfishReady = true;
                    engineMode = 'stockfish';
                    setEngineStatus('Stockfish 19', 'text-emerald-400');
                    console.log('Stockfish ready');
                    triggerEngineCalculation();
                }

                // Capture deepest score
                if (line.startsWith('info') && line.includes('score')) {
                    const mateMatch = line.match(/score mate (-?\d+)/);
                    const cpMatch   = line.match(/score cp (-?\d+)/);
                    if (mateMatch) {
                        const mate = parseInt(mateMatch[1], 10);
                        // Scale so that mate in 1 ≈ ±99900
                        window._lastSfScore = mate > 0
                            ?  (100000 - Math.abs(mate) * 100)
                            : -(100000 - Math.abs(mate) * 100);
                    } else if (cpMatch) {
                        // Score is from the side-to-move perspective in UCI
                        let cp = parseInt(cpMatch[1], 10);
                        // Convert to always White-positive for the eval bar
                        if (game.turn() === 'b') cp = -cp;
                        window._lastSfScore = cp;
                    }
                }

                if (line.startsWith('bestmove')) {
                    clearTimeout(searchTimeoutId);
                    stockfishSearching = false;

                    const parts = line.split(/\s+/);
                    const bestUci = parts[1];

                    if (!bestUci || bestUci === '(none)') {
                        finishWithFallback('no move from SF');
                        return;
                    }

                    const from  = bestUci.slice(0, 2);
                    const to    = bestUci.slice(2, 4);
                    const promo = bestUci.length > 4 ? bestUci[4] : undefined;

                    const legal = game.moves({ verbose: true });
                    const moveObj = legal.find(m =>
                        m.from === from &&
                        m.to === to &&
                        (!promo || m.promotion === promo)
                    );

                    if (moveObj) {
                        bestMoveCache = {
                            move:  moveObj,
                            score: window._lastSfScore || 0,
                            tag:   classifyFromMove(moveObj, window._lastSfScore || 0)
                        };
                    } else {
                        finishWithFallback('could not map UCI move');
                        return;
                    }

                    document.getElementById('thinking-spinner').classList.add('hidden');
                    updateStatusUI();
                    renderBoard();
                }
            };

            stockfish.onerror = function (err) {
                console.warn('Worker error on', url, err);
                clearTimeout(loadTimeout);
                try { stockfish.terminate(); } catch (_) {}
                stockfish = null;
                tryNext();
            };

            stockfish.postMessage('uci');

        } catch (err) {
            console.warn('Cannot create Worker from', url, err);
            clearTimeout(loadTimeout);
            tryNext();
        }
    }

    tryNext();
}

function parseStockfishScore(raw) {
    if (raw === undefined || raw === null) return 0;
    return raw;
}

function classifyFromMove(moveObj, score) {
    if (!moveObj) return '';
    if (moveObj.san.includes('#')) return '💀 CHECKMATE IN 1 — FINISH THEM!';
    if (Math.abs(score) >= 90000) {
        const movesToMate = Math.max(1, Math.ceil((100000 - Math.abs(score)) / 100));
        return `💀 FORCED MATE IN ${movesToMate}!`;
    }
    if (moveObj.san.includes('+') && moveObj.captured) return '🔥 CHECK + CAPTURE — BRUTAL ATTACK!';
    if (moveObj.san.includes('+')) return '⚡ FORCING CHECK — HUNTING KING!';
    if (moveObj.captured) return '⚔️ CRUSHING CAPTURE — MATERIAL GAIN!';
    if (moveObj.promotion) return '👑 QUEEN PROMOTION — GAME OVER!';
    if (Math.abs(score) > 300) return '🎯 STRONG PRESSURE — ENGINE MOVE';
    return '🎯 BEST MOVE (Stockfish)';
}

function finishWithFallback(reason) {
    console.warn('Falling back to minimax:', reason);
    stockfishSearching = false;
    clearTimeout(searchTimeoutId);
    fallbackMinimax();
    document.getElementById('thinking-spinner').classList.add('hidden');
    updateStatusUI();
    renderBoard();
}

function askStockfish() {
    // No Stockfish → instant fallback
    if (!stockfishReady || !stockfish || engineMode !== 'stockfish') {
        fallbackMinimax();
        document.getElementById('thinking-spinner').classList.add('hidden');
        updateStatusUI();
        renderBoard();
        return;
    }

    if (stockfishSearching) {
        try { stockfish.postMessage('stop'); } catch (_) {}
    }

    stockfishSearching = true;
    currentSearchId++;
    window._lastSfScore = 0;

    const fen = game.fen();
    const thinkMs = parseInt(document.getElementById('think-time').value, 10) || 1000;

    // Hard timeout: if SF does not answer, fall back so the UI never hangs
    clearTimeout(searchTimeoutId);
    searchTimeoutId = setTimeout(() => {
        if (stockfishSearching) {
            try { stockfish.postMessage('stop'); } catch (_) {}
            finishWithFallback('search timeout');
        }
    }, thinkMs + 2500); // give a little extra beyond the requested think time

    try {
        stockfish.postMessage('ucinewgame');
        stockfish.postMessage('position fen ' + fen);
        stockfish.postMessage('go movetime ' + thinkMs);
    } catch (err) {
        finishWithFallback('postMessage failed');
    }
}

// ==========================================
// 5. FALLBACK MINIMAX (original engine, kept as safety net)
// ==========================================
const PIECE_VALUES = { p: 100, n: 330, b: 345, r: 475, q: 950, k: 20000 };
const PST = { /* abbreviated – full tables from original if needed */ 
    p: [[0,0,0,0,0,0,0,0],[60,60,60,60,60,60,60,60],[20,20,30,40,40,30,20,20],[10,10,15,32,32,15,10,10],[5,5,5,28,28,5,5,5],[5,-5,-10,0,0,-10,-5,5],[5,10,10,-20,-20,10,10,5],[0,0,0,0,0,0,0,0]],
    n: [[-50,-40,-30,-30,-30,-30,-40,-50],[-40,-20,5,10,10,5,-20,-40],[-30,5,18,25,25,18,5,-30],[-30,10,20,28,28,20,10,-30],[-30,5,20,28,28,20,5,-30],[-30,5,15,20,20,15,5,-30],[-40,-20,0,5,5,0,-20,-40],[-50,-40,-30,-30,-30,-30,-40,-50]],
    b: [[-20,-10,-10,-10,-10,-10,-10,-20],[-10,5,5,5,5,5,5,-10],[-10,5,12,15,15,12,5,-10],[-10,10,10,15,15,10,10,-10],[-10,5,15,15,15,15,5,-10],[-10,15,15,15,15,15,15,-10],[-10,5,0,0,0,0,5,-10],[-20,-10,-10,-10,-10,-10,-10,-20]],
    r: [[5,5,5,5,5,5,5,5],[15,20,20,20,20,20,20,15],[-5,0,5,5,5,5,0,-5],[-5,0,5,5,5,5,0,-5],[-5,0,5,5,5,5,0,-5],[-5,0,5,5,5,5,0,-5],[-5,0,5,5,5,5,0,-5],[0,0,5,10,10,5,0,0]],
    q: [[-20,-10,-10,-5,-5,-10,-10,-20],[-10,5,5,5,5,5,5,-10],[-10,5,10,10,10,10,5,-10],[-5,5,10,10,10,10,5,-5],[0,5,10,10,10,10,5,-5],[-10,5,8,8,8,8,5,-10],[-10,0,5,0,0,0,0,-10],[-20,-10,-10,-5,-5,-10,-10,-20]],
    k: [[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-20,-30,-30,-40,-40,-30,-30,-20],[-10,-20,-20,-20,-20,-20,-20,-10],[20,20,0,0,0,0,20,20],[20,30,10,0,0,10,30,20]]
};

function evaluateBoard(chessInstance, ply = 0) {
    if (chessInstance.in_checkmate()) return chessInstance.turn() === 'w' ? (-99999 + ply) : (99999 - ply);
    if (chessInstance.in_draw() || chessInstance.in_stalemate() || chessInstance.in_threefold_repetition()) return 0;
    const board = chessInstance.board();
    let total = 0;
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const p = board[r][c];
            if (!p) continue;
            const base = PIECE_VALUES[p.type];
            const pst = p.color === 'w' ? PST[p.type][r][c] : PST[p.type][7 - r][c];
            total += (p.color === 'w' ? 1 : -1) * (base + pst);
        }
    }
    if (chessInstance.in_check()) total += (chessInstance.turn() === 'w' ? -50 : 50);
    return total;
}

function orderMoves(moves) {
    return moves.slice().sort((a, b) => {
        let sa = 0, sb = 0;
        if (a.san.includes('#')) sa += 100000;
        if (b.san.includes('#')) sb += 100000;
        if (a.san.includes('+')) sa += 500;
        if (b.san.includes('+')) sb += 500;
        if (a.captured) sa += 12 * (PIECE_VALUES[a.captured] || 100) - (PIECE_VALUES[a.piece] || 0);
        if (b.captured) sb += 12 * (PIECE_VALUES[b.captured] || 100) - (PIECE_VALUES[b.piece] || 0);
        if (a.promotion) sa += 900;
        if (b.promotion) sb += 900;
        return sb - sa;
    });
}

function minimaxDepth(chess, depth, alpha, beta, maximizing, ply) {
    if (chess.game_over()) return evaluateBoard(chess, ply);
    if (depth === 0) return evaluateBoard(chess, ply);

    const moves = orderMoves(chess.moves({ verbose: true }));
    if (!moves.length) return evaluateBoard(chess, ply);

    if (maximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < moves.length; i++) {
            chess.move(moves[i]);
            const ev = minimaxDepth(chess, depth - 1, alpha, beta, false, ply + 1);
            chess.undo();
            if (ev > maxEval) maxEval = ev;
            if (ev > alpha) alpha = ev;
            if (beta <= alpha) break;
        }
        return maxEval;
    } else {
        let minEval = Infinity;
        for (let i = 0; i < moves.length; i++) {
            chess.move(moves[i]);
            const ev = minimaxDepth(chess, depth - 1, alpha, beta, true, ply + 1);
            chess.undo();
            if (ev < minEval) minEval = ev;
            if (ev < beta) beta = ev;
            if (beta <= alpha) break;
        }
        return minEval;
    }
}

function fallbackMinimax() {
    const moves = orderMoves(game.moves({ verbose: true }));
    if (!moves.length) {
        bestMoveCache = { move: null, score: evaluateBoard(game), tag: '' };
        return;
    }

    // Instant checkmate if available
    for (const m of moves) {
        if (m.san.includes('#')) {
            bestMoveCache = {
                move: m,
                score: game.turn() === 'w' ? 99999 : -99999,
                tag: '💀 CHECKMATE IN 1 — FINISH THEM!'
            };
            return;
        }
    }

    const isWhite = game.turn() === 'w';
    let best = moves[0];
    let bestScore = isWhite ? -Infinity : Infinity;

    // Depth 2 search (fast on mobile, finds most short mates and tactics)
    const depth = 2;
    const limit = Math.min(moves.length, 24);

    for (let i = 0; i < limit; i++) {
        game.move(moves[i]);
        const score = minimaxDepth(game, depth - 1, -Infinity, Infinity, !isWhite, 1);
        game.undo();

        if (isWhite) {
            if (score > bestScore) { bestScore = score; best = moves[i]; }
        } else {
            if (score < bestScore) { bestScore = score; best = moves[i]; }
        }
        // Early exit on forced mate
        if (Math.abs(bestScore) >= 90000) break;
    }

    let tag = '⚡ Fast mode';
    if (best.san.includes('#')) tag = '💀 CHECKMATE IN 1 — FINISH THEM!';
    else if (Math.abs(bestScore) >= 90000) tag = '💀 FORCED MATE FOUND!';
    else if (best.san.includes('+')) tag = '⚡ FORCING CHECK';
    else if (best.captured) tag = '⚔️ CAPTURE';
    else tag = '⚡ Fast mode — still finds mates';

    bestMoveCache = {
        move: best,
        score: bestScore,
        tag: tag
    };
}

// ==========================================
// 6. MAIN FIND BEST MOVE (trap book → Stockfish / fallback)
// ==========================================
function findBestMove() {
    const moves = game.moves({ verbose: true });
    if (!moves.length) return { move: null, score: 0, tag: '' };

    // 1. Opening trap book (instant)
    const histKey = game.history().join(' ');
    if (TRAP_BOOK[histKey]) {
        const trap = TRAP_BOOK[histKey];
        const bookMove = moves.find(m => m.san === trap.san);
        if (bookMove) {
            return { move: bookMove, score: 80, tag: trap.tag };
        }
    }

    // 2. Stockfish (async) or immediate fallback
    if (stockfishReady && engineMode === 'stockfish') {
        askStockfish();          // will fill bestMoveCache later
        return null;             // keep spinner until answer or timeout
    }

    // 3. No Stockfish → synchronous fallback
    fallbackMinimax();
    return bestMoveCache;
}

function renderBoard() {
    const boardEl = document.getElementById('board-grid');
    boardEl.innerHTML = '';
    const files = ['a','b','c','d','e','f','g','h'];
    const ranks = ['8','7','6','5','4','3','2','1'];
    const displayRanks = boardOrientation === 'w' ? ranks : [...ranks].reverse();
    const displayFiles = boardOrientation === 'w' ? files : [...files].reverse();
    const history = game.history({ verbose: true });
    const lastMove = history.length ? history[history.length - 1] : null;
    const legalTargets = new Set(legalMovesForSelected.map(m => m.to));
    const isMyTurn = game.turn() === mySide;

    displayRanks.forEach((rank, rIdx) => {
        displayFiles.forEach((file, fIdx) => {
            const sqName = file + rank;
            const fileIndex = files.indexOf(file);
            const rankIndex = ranks.indexOf(rank);
            const isLight = (fileIndex + rankIndex) % 2 === 0;
            const sqDiv = document.createElement('div');
            sqDiv.className = `square relative flex items-center justify-center cursor-pointer select-none ${isLight ? 'sq-light' : 'sq-dark'}`;
            sqDiv.dataset.square = sqName;

            if (!isEditMode) {
                if (lastMove && (lastMove.from === sqName || lastMove.to === sqName)) sqDiv.classList.add('sq-last-move');
                if (bestMoveCache && bestMoveCache.move) {
                    if (bestMoveCache.move.from === sqName) sqDiv.classList.add('sq-best-from');
                    if (bestMoveCache.move.to === sqName) sqDiv.classList.add(isMyTurn ? 'sq-killer-to' : 'sq-best-to');
                }
                if (selectedSquare === sqName) sqDiv.classList.add('sq-selected');
            }

            const coordColor = isLight ? 'text-[#3f281d]/80' : 'text-[#d8b48a]/85';
            if (fIdx === 0) {
                const rankLabel = document.createElement('span');
                rankLabel.className = `absolute top-0.5 left-1 text-[10px] font-bold leading-none pointer-events-none ${coordColor}`;
                rankLabel.textContent = rank;
                sqDiv.appendChild(rankLabel);
            }
            if (rIdx === 7) {
                const fileLabel = document.createElement('span');
                fileLabel.className = `absolute bottom-0.5 right-1 text-[10px] font-bold leading-none uppercase pointer-events-none ${coordColor}`;
                fileLabel.textContent = file;
                sqDiv.appendChild(fileLabel);
            }

            const piece = game.get(sqName);
            if (piece) {
                const key = piece.color + piece.type.toUpperCase();
                sqDiv.insertAdjacentHTML('beforeend', PIECE_SVGS[key]);
            }
            if (!isEditMode && legalTargets.has(sqName)) {
                const indicator = document.createElement('div');
                indicator.className = `absolute ${piece ? 'legal-capture' : 'legal-dot'}`;
                sqDiv.appendChild(indicator);
            }
            sqDiv.addEventListener('click', () => handleSquareClick(sqName));
            boardEl.appendChild(sqDiv);
        });
    });
    updateStatusUI();
}

function handleSquareClick(sqName) {
    if (isEditMode) {
        if (selectedPaletteTool === 'trash') game.remove(sqName);
        else {
            const color = selectedPaletteTool[0];
            const type = selectedPaletteTool[1].toLowerCase();
            game.put({ type, color }, sqName);
        }
        renderBoard();
        return;
    }
    if (game.game_over()) return;

    const chosenMove = legalMovesForSelected.find(m => m.to === sqName);
    if (chosenMove) {
        if (chosenMove.flags.includes('p')) {
            pendingPromotionMove = { from: chosenMove.from, to: chosenMove.to };
            showPromotionModal(game.turn());
            return;
        }
        executeMove(chosenMove);
        return;
    }
    const piece = game.get(sqName);
    if (piece && piece.color === game.turn()) {
        if (selectedSquare === sqName) {
            selectedSquare = null; legalMovesForSelected = [];
        } else {
            selectedSquare = sqName;
            legalMovesForSelected = game.moves({ square: sqName, verbose: true });
        }
    } else {
        selectedSquare = null; legalMovesForSelected = [];
    }
    renderBoard();
}

function executeMove(moveObj) {
    game.move(moveObj);
    redoStack = [];
    selectedSquare = null;
    legalMovesForSelected = [];
    triggerEngineCalculation();
}

function showPromotionModal(color) {
    const modal = document.getElementById('promo-modal');
    const container = document.getElementById('promo-choices');
    container.innerHTML = '';
    ['q','n','r','b'].forEach(type => {
        const btn = document.createElement('button');
        btn.className = 'bg-slate-700 hover:bg-slate-600 p-2 rounded-xl flex items-center justify-center aspect-square border border-slate-600';
        btn.innerHTML = PIECE_SVGS[color + type.toUpperCase()];
        btn.onclick = () => {
            modal.classList.add('hidden');
            if (pendingPromotionMove) {
                executeMove({ ...pendingPromotionMove, promotion: type });
                pendingPromotionMove = null;
            }
        };
        container.appendChild(btn);
    });
    modal.classList.remove('hidden');
}

function triggerEngineCalculation() {
    const spinner = document.getElementById('thinking-spinner');
    spinner.classList.remove('hidden');
    bestMoveCache = null;
    // Cancel any previous search timeout
    clearTimeout(searchTimeoutId);
    if (stockfishSearching && stockfish) {
        try { stockfish.postMessage('stop'); } catch (_) {}
        stockfishSearching = false;
    }
    renderBoard();

    // Small delay so the spinner is visible, then search
    setTimeout(() => {
        if (game.game_over()) {
            bestMoveCache = { move: null, score: 0, tag: '' };
            spinner.classList.add('hidden');
            updateStatusUI();
            renderBoard();
            return;
        }

        const result = findBestMove();

        // Instant result (trap book or fallback)
        if (result) {
            bestMoveCache = result;
            spinner.classList.add('hidden');
            updateStatusUI();
            renderBoard();
        }
        // else Stockfish is thinking; bestmove handler OR the hard timeout will finish
    }, 30);
}

        applyBtn.disabled = false;
        applyBtn.classList.remove('opacity-40');
        applyBtn.className = isMyTurn
            ? 'bg-rose-500 hover:bg-rose-400 active:scale-95 text-white font-black text-xs px-3.5 py-2.5 rounded-xl shadow transition shrink-0 ml-2'
            : 'bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-bold text-xs px-3.5 py-2.5 rounded-xl shadow transition shrink-0 ml-2';
    } else {
        if (engineMode === 'stockfish' && stockfishReady) {
            bestMoveText.textContent = 'Stockfish thinking…';
            tacticTag.textContent = 'Deep analysis in progress';
        } else if (engineMode === 'loading') {
            bestMoveText.textContent = 'Loading engine…';
            tacticTag.textContent = 'Please wait a moment';
        } else {
            bestMoveText.textContent = 'Calculating…';
            tacticTag.textContent = 'Fast mode active';
        }
    }

    // Eval bar
    const rawScore = bestMoveCache ? bestMoveCache.score : 0;
    // Stockfish score is from the side to move perspective in some builds,
    // but we normalize: positive = White advantage
    let displayScore = rawScore;
    if (game.turn() === 'b' && Math.abs(rawScore) < 90000) {
        // Many SF builds report score relative to side-to-move
        // For simplicity we keep raw and let the bar show approximate
    }
    const pawns = (displayScore / 100).toFixed(1);
    const clamped = Math.max(-800, Math.min(800, displayScore));
    const whitePercent = 50 + (clamped / 800) * 46;
    evalFill.style.width = `${whitePercent}%`;

    if (Math.abs(displayScore) >= 90000) {
        evalScore.textContent = displayScore > 0 ? 'White Mates!' : 'Brown Mates!';
    } else if (displayScore > 25) {
        evalScore.textContent = `+${pawns} White`;
    } else if (displayScore < -25) {
        evalScore.textContent = `+${Math.abs(pawns)} Brown`;
    } else {
        evalScore.textContent = '0.0 (Even)';
    }

    document.getElementById('btn-undo').disabled = game.history().length === 0 || isEditMode;
    document.getElementById('btn-redo').disabled = redoStack.length === 0 || isEditMode;
}

// ==========================================
// 8. CONTROLS
// ==========================================
function setMySide(side) {
    mySide = side;
    boardOrientation = side;
    const wBtn = document.getElementById('side-w-btn');
    const bBtn = document.getElementById('side-b-btn');
    if (side === 'w') {
        wBtn.className = 'px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-emerald-600 text-white shadow';
        bBtn.className = 'px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-400 hover:text-white';
    } else {
        bBtn.className = 'px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-emerald-600 text-white shadow';
        wBtn.className = 'px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-400 hover:text-white';
    }
    renderBoard();
}

function applySuggestedMove() {
    if (bestMoveCache && bestMoveCache.move && !isEditMode) {
        executeMove(bestMoveCache.move);
    }
}

function undoMove() {
    if (isEditMode) return;
    const undone = game.undo();
    if (undone) {
        redoStack.push(undone);
        selectedSquare = null;
        legalMovesForSelected = [];
        triggerEngineCalculation();
    }
}

function redoMove() {
    if (isEditMode || !redoStack.length) return;
    const move = redoStack.pop();
    game.move(move);
    selectedSquare = null;
    legalMovesForSelected = [];
    triggerEngineCalculation();
}

function resetBoard() {
    game.reset();
    redoStack = [];
    selectedSquare = null;
    legalMovesForSelected = [];
    if (isEditMode) toggleEditMode();
    triggerEngineCalculation();
}

function toggleEditMode() {
    isEditMode = !isEditMode;
    const panel = document.getElementById('editor-panel');
    const btnLabel = document.getElementById('edit-btn-label');
    const suggestionCard = document.getElementById('suggestion-card');
    if (isEditMode) {
        panel.classList.remove('hidden');
        suggestionCard.classList.add('opacity-50', 'pointer-events-none');
        btnLabel.textContent = 'Exit Edit';
        selectedSquare = null;
        legalMovesForSelected = [];
        buildPalette();
        updateEditorTurnButtons();
        renderBoard();
    } else {
        panel.classList.add('hidden');
        suggestionCard.classList.remove('opacity-50', 'pointer-events-none');
        btnLabel.textContent = 'Edit Board';
        redoStack = [];
        triggerEngineCalculation();
    }
}

function buildPalette() {
    const palette = document.getElementById('piece-palette');
    palette.innerHTML = '';
    const items = ['wK','wQ','wR','wB','wN','wP','trash','bK','bQ','bR','bB','bN','bP'];
    items.forEach(item => {
        const btn = document.createElement('button');
        const isSelected = selectedPaletteTool === item;
        btn.className = `aspect-square rounded-lg flex items-center justify-center p-1 border transition ${
            isSelected ? 'bg-emerald-600/40 border-emerald-400 scale-105' : 'bg-slate-700/80 border-slate-600'
        }`;
        if (item === 'trash') btn.innerHTML = `<span class="text-rose-400 text-base font-bold">✕</span>`;
        else btn.innerHTML = PIECE_SVGS[item];
        btn.onclick = () => { selectedPaletteTool = item; buildPalette(); };
        palette.appendChild(btn);
    });
}

function clearBoard() { game.clear(); renderBoard(); }

function setEditorTurn(color) {
    const tokens = game.fen().split(' ');
    tokens[1] = color;
    tokens[2] = '-';
    tokens[3] = '-';
    game.load(tokens.join(' '));
    updateEditorTurnButtons();
    renderBoard();
}

function updateEditorTurnButtons() {
    const isW = game.turn() === 'w';
    document.getElementById('turn-w-btn').className = isW
        ? 'px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-semibold'
        : 'px-2.5 py-1 rounded-lg bg-slate-700 text-slate-300 font-semibold';
    document.getElementById('turn-b-btn').className = !isW
        ? 'px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-semibold'
        : 'px-2.5 py-1 rounded-lg bg-slate-700 text-slate-300 font-semibold';
}

// ==========================================
// 9. START
// ==========================================
window.onload = () => {
    setMySide('b');
    initStockfish();          // loads Stockfish, then triggers first calculation
};
</script>
