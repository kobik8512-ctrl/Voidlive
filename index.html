<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Motion Cam</title>
<style>
  :root {
    --bg: #0a0a0a;
    --green: #30d158;
    --text: #ffffff;
    --muted: #8e8e93;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    user-select: none;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100%;
  }

  #camera-wrap {
    position: absolute;
    inset: 0;
    background: #000;
    overflow: hidden;
  }

  #video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top));
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
  }

  .title {
    font-size: 15px;
    font-weight: 600;
  }

  .status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  .dot.live {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }

  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 16px 20px 28px;
    padding-bottom: max(28px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
  }

  button {
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 22px;
    cursor: pointer;
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15);
    transition: transform 0.15s;
  }
  button:active { transform: scale(0.96); }
  button.active {
    background: var(--green);
    border-color: var(--green);
    color: #000;
  }

  #overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
    gap: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 22px; font-weight: 700; }
  #overlay p { font-size: 15px; color: var(--muted); max-width: 280px; line-height: 1.45; }
  #overlay button { margin-top: 12px; background: var(--green); color: #000; border: none; padding: 14px 28px; }
</style>
</head>
<body>
<div id="app">
  <div id="camera-wrap">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>

    <div class="top-bar">
      <div class="title">Motion Cam</div>
      <div class="status">
        <div class="dot" id="dot"></div>
        <span id="status-text">Starting…</span>
      </div>
    </div>

    <div class="bottom-bar">
      <button id="btn-toggle" class="active">Detecting</button>
    </div>
  </div>

  <div id="overlay">
    <h1>Camera access needed</h1>
    <p>Allow the back camera to detect moving objects.</p>
    <button id="btn-allow">Enable Camera</button>
  </div>
</div>

<script>
(function () {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const statusText = document.getElementById('status-text');
  const dot = document.getElementById('dot');
  const overlay = document.getElementById('overlay');
  const btnAllow = document.getElementById('btn-allow');
  const btnToggle = document.getElementById('btn-toggle');

  let stream = null;
  let detecting = true;
  let animId = null;
  let prevGray = null;

  // Detection settings
  const DOWNSCALE = 0.35;        // process smaller for speed
  const THRESH = 30;             // pixel difference threshold
  const MIN_BLOB = 80;           // min changed pixels in a cell to consider
  const GRID = 12;               // grid size for blob grouping
  const BOX_PAD = 8;
  const SMOOTH = 0.55;           // box smoothing

  let lastBoxes = [];

  function setStatus(text, live) {
    statusText.textContent = text;
    dot.classList.toggle('live', !!live);
  }

  async function startCamera() {
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });
      video.srcObject = stream;
      await video.play();
      overlay.classList.add('hidden');
      setStatus('Live', true);
      resize();
      if (!animId) loop();
    } catch (err) {
      console.error(err);
      overlay.classList.remove('hidden');
      setStatus('Camera blocked', false);
    }
  }

  function resize() {
    const w = video.videoWidth || video.clientWidth;
    const h = video.videoHeight || video.clientHeight;
    if (w && h) {
      canvas.width = w;
      canvas.height = h;
    }
  }

  function toGray(data, w, h, scale) {
    const sw = Math.max(1, Math.floor(w * scale));
    const sh = Math.max(1, Math.floor(h * scale));
    const gray = new Uint8Array(sw * sh);
    const xRatio = w / sw;
    const yRatio = h / sh;
    for (let y = 0; y < sh; y++) {
      for (let x = 0; x < sw; x++) {
        const sx = Math.floor(x * xRatio);
        const sy = Math.floor(y * yRatio);
        const i = (sy * w + sx) * 4;
        // simple luminance
        gray[y * sw + x] = (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114) | 0;
      }
    }
    return { gray, sw, sh };
  }

  function findBoxes(curr, prev, sw, sh, fullW, fullH) {
    if (!prev || prev.length !== curr.length) return [];

    const cellW = Math.ceil(sw / GRID);
    const cellH = Math.ceil(sh / GRID);
    const active = [];

    for (let gy = 0; gy < GRID; gy++) {
      for (let gx = 0; gx < GRID; gx++) {
        let changed = 0;
        const x0 = gx * cellW;
        const y0 = gy * cellH;
        const x1 = Math.min(sw, x0 + cellW);
        const y1 = Math.min(sh, y0 + cellH);

        for (let y = y0; y < y1; y++) {
          for (let x = x0; x < x1; x++) {
            const i = y * sw + x;
            if (Math.abs(curr[i] - prev[i]) > THRESH) changed++;
          }
        }

        if (changed > MIN_BLOB) {
          active.push({ gx, gy, x0, y0, x1, y1 });
        }
      }
    }

    if (!active.length) return [];

    // Merge nearby active cells into groups
    const used = new Array(active.length).fill(false);
    const groups = [];

    for (let i = 0; i < active.length; i++) {
      if (used[i]) continue;
      const queue = [i];
      used[i] = true;
      let minX = active[i].x0, minY = active[i].y0;
      let maxX = active[i].x1, maxY = active[i].y1;

      while (queue.length) {
        const idx = queue.pop();
        const a = active[idx];
        for (let j = 0; j < active.length; j++) {
          if (used[j]) continue;
          const b = active[j];
          // adjacent cells (including diagonal)
          if (Math.abs(a.gx - b.gx) <= 1 && Math.abs(a.gy - b.gy) <= 1) {
            used[j] = true;
            queue.push(j);
            minX = Math.min(minX, b.x0);
            minY = Math.min(minY, b.y0);
            maxX = Math.max(maxX, b.x1);
            maxY = Math.max(maxY, b.y1);
          }
        }
      }

      // Map back to full resolution
      const scaleX = fullW / sw;
      const scaleY = fullH / sh;
      groups.push({
        x: Math.max(0, minX * scaleX - BOX_PAD),
        y: Math.max(0, minY * scaleY - BOX_PAD),
        w: Math.min(fullW, (maxX - minX) * scaleX + BOX_PAD * 2),
        h: Math.min(fullH, (maxY - minY) * scaleY + BOX_PAD * 2)
      });
    }

    // Filter tiny boxes
    return groups.filter(b => b.w > 30 && b.h > 30);
  }

  function smoothBoxes(newBoxes) {
    if (!lastBoxes.length) {
      lastBoxes = newBoxes;
      return newBoxes;
    }

    const smoothed = [];
    const matched = new Array(lastBoxes.length).fill(false);

    for (const nb of newBoxes) {
      let best = -1;
      let bestDist = 99999;
      for (let i = 0; i < lastBoxes.length; i++) {
        if (matched[i]) continue;
        const lb = lastBoxes[i];
        const cx1 = nb.x + nb.w / 2;
        const cy1 = nb.y + nb.h / 2;
        const cx2 = lb.x + lb.w / 2;
        const cy2 = lb.y + lb.h / 2;
        const d = Math.hypot(cx1 - cx2, cy1 - cy2);
        if (d < bestDist && d < 120) {
          bestDist = d;
          best = i;
        }
      }

      if (best >= 0) {
        matched[best] = true;
        const lb = lastBoxes[best];
        smoothed.push({
          x: lb.x * SMOOTH + nb.x * (1 - SMOOTH),
          y: lb.y * SMOOTH + nb.y * (1 - SMOOTH),
          w: lb.w * SMOOTH + nb.w * (1 - SMOOTH),
          h: lb.h * SMOOTH + nb.h * (1 - SMOOTH)
        });
      } else {
        smoothed.push(nb);
      }
    }

    lastBoxes = smoothed;
    return smoothed;
  }

  function drawBoxes(boxes) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#30d158';
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(48, 209, 88, 0.6)';
    ctx.shadowBlur = 8;

    for (const b of boxes) {
      ctx.strokeRect(b.x, b.y, b.w, b.h);

      // corner accents
      const len = 14;
      ctx.beginPath();
      // top-left
      ctx.moveTo(b.x, b.y + len);
      ctx.lineTo(b.x, b.y);
      ctx.lineTo(b.x + len, b.y);
      // top-right
      ctx.moveTo(b.x + b.w - len, b.y);
      ctx.lineTo(b.x + b.w, b.y);
      ctx.lineTo(b.x + b.w, b.y + len);
      // bottom-left
      ctx.moveTo(b.x, b.y + b.h - len);
      ctx.lineTo(b.x, b.y + b.h);
      ctx.lineTo(b.x + len, b.y + b.h);
      // bottom-right
      ctx.moveTo(b.x + b.w - len, b.y + b.h);
      ctx.lineTo(b.x + b.w, b.y + b.h);
      ctx.lineTo(b.x + b.w, b.y + b.h - len);
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
  }

  function loop() {
    animId = requestAnimationFrame(loop);
    if (!detecting || video.readyState < 2) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }

    const w = canvas.width;
    const h = canvas.height;
    if (!w || !h) return;

    // Draw current frame to offscreen logic via getImageData
    ctx.drawImage(video, 0, 0, w, h);
    const frame = ctx.getImageData(0, 0, w, h);

    const { gray, sw, sh } = toGray(frame.data, w, h, DOWNSCALE);

    const boxes = findBoxes(gray, prevGray, sw, sh, w, h);
    prevGray = gray;

    const smooth = smoothBoxes(boxes);
    // Clear and only draw boxes (video is under the canvas)
    ctx.clearRect(0, 0, w, h);
    drawBoxes(smooth);
  }

  btnAllow.addEventListener('click', startCamera);
  btnToggle.addEventListener('click', () => {
    detecting = !detecting;
    btnToggle.textContent = detecting ? 'Detecting' : 'Paused';
    btnToggle.classList.toggle('active', detecting);
    setStatus(detecting ? 'Live' : 'Paused', detecting);
    if (!detecting) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      lastBoxes = [];
    }
  });

  window.addEventListener('resize', resize);
  video.addEventListener('loadedmetadata', resize);

  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    startCamera();
  } else {
    setStatus('No camera', false);
  }
})();
</script>
</body>
</html>
