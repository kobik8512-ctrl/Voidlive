<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypergamy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.postimg.cc/mknWhJF2/Screenshot-20261014-220808-Tik-Tok.jpg" alt="Hypergamy Infographic">
    </div>

    <!-- Hidden Audio Player -->
    <audio id="bg-music" loop autoplay>
        <source src="https://files.catbox.moe/5zxod1.mp4" type="audio/mp4">
    </audio>

    <script>
        const audio = document.getElementById('bg-music');
        
        // Start playing automatically
        audio.play().catch(() => {
            // Fallback for strict browser autoplay policies: play on first tap
            document.body.addEventListener('click', () => {
                audio.play();
            }, { once: true });
        });
    </script>

</body>
</html>
